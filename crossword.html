<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가로세로 낱말퍼즐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFE9FB; --hero:#DCCFF6; --surface:#FFFFFF; --ink:#231B33; --soft:#5E5470; --line:#DDD3F2;
    --accent:#7A55C9; --accent-ink:#FFFFFF; --sel:#E6DBFB; --cur:#C9B4F4; --ok:#2E8B57; --ok-bg:#DDF3E5; --block:#E4DCF5;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#17121F; --hero:#2A2040; --surface:#221B2E; --ink:#EEE8F8; --soft:#B6AAC9; --line:#3A2F4D;
    --accent:#B394F0; --accent-ink:#17121F; --sel:#3A2D55; --cur:#5A4485; --ok:#7FD3A0; --ok-bg:#1F3A2B; --block:#1C1626; } }
  :root[data-theme="dark"]{
    --bg:#17121F; --hero:#2A2040; --surface:#221B2E; --ink:#EEE8F8; --soft:#B6AAC9; --line:#3A2F4D;
    --accent:#B394F0; --accent-ink:#17121F; --sel:#3A2D55; --cur:#5A4485; --ok:#7FD3A0; --ok-bg:#1F3A2B; --block:#1C1626; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:linear-gradient(180deg,var(--hero) 0,var(--bg) 340px) no-repeat, var(--bg); color:var(--ink); font-family:'Noto Sans KR',sans-serif; font-size:17px; line-height:1.6; min-height:100vh; }
  .wrap{ max-width:1080px; margin:0 auto; padding:28px 16px 48px; }
  header{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .kicker{ font-size:14px; color:var(--soft); }
  h1{ font-family:'Gowun Batang',serif; font-size:32px; line-height:1.3; margin-top:4px; }
  .theme{ border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; padding:6px 12px; font:inherit; font-size:14px; cursor:pointer; white-space:nowrap; }
  .tabs{ display:flex; gap:8px; margin:20px 0 14px; flex-wrap:wrap; }
  .tab{ border:1.5px solid var(--line); background:var(--surface); color:var(--ink); border-radius:999px; padding:8px 16px; font:inherit; font-size:16px; font-weight:500; cursor:pointer; }
  .tab[aria-selected="true"]{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .bar{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; color:var(--soft); font-size:15px; margin-bottom:12px; }
  .bar b{ color:var(--ink); }
  .layout{ display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,1fr); gap:18px; align-items:start; }
  .card{ background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; }
  .board-wrap{ overflow-x:auto; }
  .board{ display:grid; gap:3px; margin:0 auto; width:max-content; }
  .cell{ width:var(--cs); height:var(--cs); border-radius:7px; position:relative; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:calc(var(--cs) * .5); user-select:none; }
  .cell.block{ background:transparent; }
  .cell.open{ background:var(--surface); border:1.5px solid var(--line); cursor:pointer; }
  .cell.open.in{ background:var(--sel); }
  .cell.open.cur{ background:var(--cur); border-color:var(--accent); }
  .cell.open.done{ background:var(--ok-bg); color:var(--ok); border-color:transparent; }
  .cell .num{ position:absolute; top:1px; left:3px; font-size:10px; font-weight:500; color:var(--soft); line-height:1; }
  .entry{ margin-top:14px; border-top:1px solid var(--line); padding-top:14px; }
  .entry .q{ font-size:16px; min-height:52px; }
  .entry .q b{ color:var(--accent); }
  .row{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .row input{ flex:1 1 160px; min-width:0; font:inherit; font-size:18px; padding:10px 12px; border-radius:12px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); }
  .row input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .btn{ font:inherit; font-size:15px; font-weight:500; border-radius:12px; padding:10px 14px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; }
  .btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .msg{ margin-top:8px; font-size:15px; min-height:24px; }
  .msg.good{ color:var(--ok); font-weight:700; } .msg.bad{ color:#C0392B; }
  h2{ font-family:'Gowun Batang',serif; font-size:20px; margin:4px 0 8px; }
  .clues + h2{ margin-top:16px; }
  .clues{ list-style:none; display:flex; flex-direction:column; gap:4px; }
  .clues li{ padding:7px 10px; border-radius:10px; cursor:pointer; font-size:15.5px; line-height:1.5; }
  .clues li:hover{ background:var(--sel); }
  .clues li.cur{ background:var(--cur); }
  .clues li.done{ color:var(--soft); text-decoration:line-through; text-decoration-color:var(--ok); }
  .clues li .n{ font-weight:700; color:var(--accent); margin-right:6px; }
  .clues li .len{ color:var(--soft); font-size:13px; margin-left:4px; }
  .foot{ display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .finish{ display:none; text-align:center; padding:22px 16px; margin-bottom:16px; background:var(--surface); border:2px solid var(--accent); border-radius:18px; }
  .finish.show{ display:block; }
  .finish h3{ font-family:'Gowun Batang',serif; font-size:26px; color:var(--accent); }
  footer{ text-align:center; color:var(--soft); font-size:14px; margin-top:32px; }
  @media (max-width:820px){ .layout{ grid-template-columns:1fr; } h1{ font-size:26px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="kicker">현대사회와 윤리 · Ⅳ. 민주시민과 윤리</div>
      <h1>가로세로 낱말퍼즐</h1>
    </div>
    <button class="theme" id="themeBtn" type="button">화면 밝기</button>
  </header>

  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="bar"><span>맞힌 낱말 <b id="cnt">0</b> / <b id="tot">0</b></span><span>시간 <b id="time">0:00</b></span><span>힌트 <b id="hints">0</b>회</span></div>

  <div class="finish" id="finish"><h3>완성했습니다!</h3><p id="finishTxt"></p><p style="margin-top:6px;color:var(--soft)">현대사회와 윤리 ♥무늬T♥</p></div>

  <div class="layout">
    <div class="card">
      <div class="board-wrap"><div class="board" id="board"></div></div>
      <div class="entry">
        <div class="q" id="q">칸이나 단서를 누르고 답을 입력합니다.</div>
        <div class="row">
          <input id="ans" type="text" autocomplete="off" placeholder="답 입력 (띄어쓰기 없이)" aria-label="답 입력">
          <button class="btn primary" id="check" type="button">확인</button>
          <button class="btn" id="hint" type="button">힌트</button>
        </div>
        <div class="msg" id="msg" aria-live="polite"></div>
      </div>
    </div>
    <div class="card">
      <h2>가로 열쇠</h2><ol class="clues" id="across"></ol>
      <h2>세로 열쇠</h2><ol class="clues" id="down"></ol>
      <div class="foot">
        <button class="btn" id="reset" type="button">다시 하기</button>
        <button class="btn" id="reveal" type="button">정답 보기(교사용)</button>
      </div>
    </div>
  </div>
  <footer>현대사회와 윤리 ♥무늬T♥</footer>
</div>
<script>
const DATA = {"a":{"rows":12,"cols":12,"words":[{"n":1,"word":"공동체주의","clue":"매킨타이어처럼 전통과 공동선, 구성원의 덕목을 중시하는 사상","r":0,"c":5,"dir":"d"},{"n":1,"word":"공청회","clue":"정책을 결정할 때 공개적으로 의견을 듣는 자리","r":0,"c":5,"dir":"a"},{"n":2,"word":"이익","clue":"싱어: 손해보다 ○○이 더 큰 경우 시민불복종 가능","r":1,"c":0,"dir":"d"},{"n":3,"word":"권리","clue":"의무는 개인의 ○○를 전제한다.","r":1,"c":2,"dir":"d"},{"n":4,"word":"양심","clue":"소로: 법보다 개인의 ○○을 따라야 한다.","r":1,"c":8,"dir":"a"},{"n":5,"word":"민주주의","clue":"시민의 정치참여는 더 좋은 ○○○○ 실현의 토대가 된다.","r":2,"c":11,"dir":"d"},{"n":6,"word":"자유","clue":"롤스: 모든 사람은 기본적 ○○를 누릴 평등한 권리를 가져야 한다.","r":3,"c":3,"dir":"d"},{"n":7,"word":"주민소환제","clue":"투표로 공직자를 제재하는 시민 참여 제도","r":3,"c":5,"dir":"a"},{"n":8,"word":"소로","clue":"『시민의 불복종』을 쓰고 인두세 납부를 거부한 사상가","r":3,"c":7,"dir":"d"},{"n":9,"word":"자율적","clue":"자유주의의 인간관: 스스로 판단하고 선택하는 ○○○인 존재","r":4,"c":2,"dir":"d"},{"n":9,"word":"자유주의","clue":"개인의 자유를 최상의 가치로 여기는 사상(롤스)","r":4,"c":2,"dir":"a"},{"n":10,"word":"사회적역할","clue":"공동체주의: 인간은 공동체 안에서 ○○○ ○○을 수행하며 정체성을 형성한다.","r":6,"c":0,"dir":"a"},{"n":10,"word":"사회계약","clue":"홉스·로크·루소가 국가 형성의 근거로 본 것","r":6,"c":0,"dir":"d"},{"n":11,"word":"다수","clue":"롤스: ○○의 정의관에 어긋나는 경우 최후의 수단으로 시민불복종 가능","r":6,"c":10,"dir":"d"},{"n":12,"word":"준법의식","clue":"시민불복종의 한계: 시민들의 ○○ ○○을 약화할 수 있다.","r":7,"c":7,"dir":"d"},{"n":13,"word":"수단","clue":"공동체주의가 지나치면 개인을 집단의 발전을 위한 ○○으로 취급할 수 있다.","r":7,"c":10,"dir":"a"},{"n":14,"word":"계약","clue":"사회 ○○론: 권리를 보호받기 위해 국가를 형성하기로 맺는 약속","r":8,"c":0,"dir":"a"},{"n":15,"word":"민본주의","clue":"나라의 근본을 백성에 두는 유교의 정신","r":9,"c":4,"dir":"a"},{"n":16,"word":"본성","clue":"아리스토텔레스: 국가는 인간의 ○○에 의해 자연스럽게 형성되었다.","r":9,"c":5,"dir":"d"},{"n":17,"word":"로크","clue":"국가가 시민을 보호하지 못하면 저항권을 행사할 수 있다고 본 사상가","r":9,"c":9,"dir":"d"},{"n":18,"word":"정책","clue":"정치참여: ○○의 결정이나 집행에 직접 참여하여 영향을 미치는 것","r":10,"c":2,"dir":"a"},{"n":19,"word":"목적","clue":"롤스의 시민불복종 조건: ○○의 정당성 — 사적 이익이 아닌 공익을 위해","r":11,"c":10,"dir":"a"}],"title":"Ⅳ-02 시민성과 윤리"},"b":{"rows":12,"cols":12,"words":[{"n":1,"word":"도덕성","clue":"개인 윤리: 개인의 ○○○을 함양하여 사회 문제를 해결","r":0,"c":0,"dir":"d"},{"n":2,"word":"이익","clue":"분배적 정의: 사회적 ○○이나 부담을 공정하게 분배하는 것","r":0,"c":4,"dir":"d"},{"n":3,"word":"인간존엄성","clue":"공리주의 처벌관 비판: 사회적 이익을 우선하여 ○○ ○○○을 훼손할 수 있다.","r":0,"c":7,"dir":"a"},{"n":4,"word":"공리주의","clue":"처벌을 사회의 이익을 증진하는 수단으로 보는 관점","r":1,"c":6,"dir":"d"},{"n":5,"word":"역차별","clue":"소수자 우대 정책으로 다수 집단이 부당하게 불이익을 받는 것","r":2,"c":2,"dir":"d"},{"n":6,"word":"교정적정의","clue":"범죄를 공정하게 처벌하고 손해를 배상하게 하여 부정의를 바로잡는 것","r":3,"c":4,"dir":"d"},{"n":7,"word":"종신노역형","clue":"베카리아가 사형보다 범죄 예방에 효과적이라고 본 형벌","r":3,"c":8,"dir":"d"},{"n":8,"word":"처벌","clue":"교정적 정의: 범죄 행위에 대해 공정하게 ○○하는 것","r":3,"c":10,"dir":"d"},{"n":9,"word":"정의의여신","clue":"한 손에 검, 다른 손에 저울을 든 상징","r":4,"c":4,"dir":"a"},{"n":10,"word":"기회균등","clue":"롤스 제2원칙: 불평등의 계기가 되는 지위는 모두에게 개방(○○○○의 원칙)","r":5,"c":1,"dir":"d"},{"n":11,"word":"노직","clue":"취득·양도·교정의 원칙을 주장한 사상가","r":5,"c":8,"dir":"a"},{"n":12,"word":"최소국가","clue":"노직: 국가는 소유 보호와 국방 정도만 담당해야 한다(○○ ○○론).","r":5,"c":11,"dir":"d"},{"n":13,"word":"회복적정의","clue":"가해자를 벌하기보다 피해를 바로잡고 관계를 되살리는 데 초점을 둔 정의","r":6,"c":1,"dir":"a"},{"n":14,"word":"루소","clue":"사회 계약의 관점에서 시민의 생명과 안전을 위한 사형은 정당하다고 본 사상가","r":6,"c":10,"dir":"a"},{"n":15,"word":"사형","clue":"국가가 범죄자의 생명을 박탈하는 형벌","r":7,"c":7,"dir":"a"},{"n":15,"word":"사회윤리","clue":"개인 윤리의 한계를 보완하며 구조·제도 개선에 초점을 두는 것(니부어)","r":7,"c":7,"dir":"d"},{"n":16,"word":"동등성","clue":"칸트: ○○○의 원리에 따라 살인자에 대한 사형은 정당하다.","r":8,"c":0,"dir":"a"},{"n":17,"word":"억제","clue":"베카리아: 형벌은 범죄를 ○○하기에 충분한 강도만 가져야 한다.","r":8,"c":9,"dir":"d"},{"n":18,"word":"교화","clue":"응보주의 비판: 범죄 예방과 범죄자의 ○○를 소홀히 한다.","r":9,"c":3,"dir":"a"},{"n":19,"word":"제도","clue":"사회 윤리: 사회 구조와 ○○를 개선하여 사회 문제를 해결","r":9,"c":9,"dir":"a"},{"n":20,"word":"집단","clue":"니부어: 도덕적인 개인도 ○○에 소속되면 비도덕적으로 행동하기 쉽다.","r":10,"c":0,"dir":"a"},{"n":21,"word":"베카리아","clue":"『범죄와 형벌』에서 사형 폐지를 주장한 사상가","r":10,"c":5,"dir":"a"},{"n":22,"word":"보복","clue":"응보주의: 처벌은 범죄 행위에 상응하는 ○○을 가하는 것","r":10,"c":11,"dir":"d"},{"n":23,"word":"소유권","clue":"노직: 개인의 ○○○을 보장하는 것이 정의이다.","r":11,"c":2,"dir":"a"}],"title":"Ⅳ-03 사회 정의와 윤리"}};
const store = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
const $ = (id) => document.getElementById(id);
let pid = 'a', st = null, cur = null, timer = null;
const words = () => DATA[pid].words;
const cells = (w) => [...w.word].map((ch, i) => ({ r: w.r + (w.dir === 'd' ? i : 0), c: w.c + (w.dir === 'a' ? i : 0), ch }));
const wid = (w) => w.n + w.dir;

function load(){
  st = store.get('democ-cw-' + pid) || { solved:{}, hints:{}, sec:0 };
  render(); tick();
}
function save(){ store.set('democ-cw-' + pid, st); }
function tick(){
  clearInterval(timer);
  const all = Object.keys(st.solved).length === words().length;
  if (all) return showTime();
  timer = setInterval(() => { st.sec++; showTime(); if (st.sec % 5 === 0) save(); }, 1000);
}
function showTime(){ const s = st.sec; $('time').textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }

function render(){
  const D = DATA[pid];
  // tabs
  $('tabs').innerHTML = Object.keys(DATA).map((k) => `<button class="tab" role="tab" aria-selected="${k===pid}" data-k="${k}">${DATA[k].title}</button>`).join('');
  // board
  const ww = document.querySelector('.board-wrap').clientWidth || 400; const cs = Math.max(24, Math.min(44, Math.floor((ww - (D.cols - 1) * 3) / D.cols)));
  const b = $('board'); b.style.setProperty('--cs', cs + 'px'); b.style.gridTemplateColumns = `repeat(${D.cols}, ${cs}px)`;
  const map = {}; const nums = {};
  words().forEach((w) => { nums[w.r + ',' + w.c] = w.n; cells(w).forEach((x) => { const k = x.r + ',' + x.c; (map[k] = map[k] || { ch:x.ch, ws:[] }).ws.push(w); }); });
  let h = '';
  for (let r = 0; r < D.rows; r++) for (let c = 0; c < D.cols; c++) {
    const k = r + ',' + c, m = map[k];
    if (!m) { h += '<div class="cell block"></div>'; continue; }
    const done = m.ws.some((w) => st.solved[wid(w)]);
    const inCur = cur && m.ws.includes(cur);
    const hintShown = m.ws.some((w) => st.hints[wid(w)] && cells(w)[0].r === r && cells(w)[0].c === c);
    h += `<div class="cell open${done?' done':''}${inCur?' in':''}" data-k="${k}">${nums[k]?`<span class="num">${nums[k]}</span>`:''}${done||hintShown?m.ch:''}</div>`;
  }
  b.innerHTML = h;
  b.querySelectorAll('.cell.open').forEach((el) => el.onclick = () => {
    const ws = map[el.dataset.k].ws; select(ws.length > 1 && cur === ws[0] ? ws[1] : ws.find((w) => !st.solved[wid(w)]) || ws[0]);
  });
  // clues
  for (const [dir, id] of [['a','across'],['d','down']]) {
    $(id).innerHTML = words().filter((w) => w.dir === dir).sort((x,y) => x.n - y.n).map((w) =>
      `<li data-w="${wid(w)}" class="${st.solved[wid(w)]?'done':''}${cur===w?' cur':''}"><span class="n">${w.n}</span>${w.clue}<span class="len">(${[...w.word].length}글자)</span></li>`).join('');
    $(id).querySelectorAll('li').forEach((li) => li.onclick = () => select(words().find((w) => wid(w) === li.dataset.w)));
  }
  $('cnt').textContent = Object.keys(st.solved).length; $('tot').textContent = words().length; $('hints').textContent = Object.keys(st.hints).length; showTime();
  const all = Object.keys(st.solved).length === words().length;
  $('finish').classList.toggle('show', all);
  if (all) $('finishTxt').textContent = `걸린 시간 ${$('time').textContent} · 힌트 ${Object.keys(st.hints).length}회`;
  document.querySelectorAll('.tab').forEach((t) => t.onclick = () => { save(); pid = t.dataset.k; cur = null; $('q').textContent = '칸이나 단서를 누르고 답을 입력합니다.'; $('msg').textContent=''; load(); });
}
function select(w){
  cur = w; render();
  $('q').innerHTML = `<b>${w.n} ${w.dir==='a'?'가로':'세로'}</b> · ${w.clue} <span style="color:var(--soft);font-size:14px">(${[...w.word].length}글자)</span>`;
  $('msg').textContent = ''; $('msg').className = 'msg';
  const a = $('ans'); a.value = ''; a.disabled = !!st.solved[wid(w)]; if (!a.disabled) a.focus({ preventScroll:true });
}
function check(){
  if (!cur) { $('msg').textContent = '먼저 칸이나 단서를 고릅니다.'; return; }
  const v = $('ans').value.replace(/\s/g, '');
  if (!v) return;
  if (v === cur.word) {
    st.solved[wid(cur)] = 1; save();
    // also mark any other word fully covered by solved cells? keep simple
    $('msg').textContent = '정답입니다!'; $('msg').className = 'msg good';
    const w = cur; render(); cur = null; $('ans').value = ''; $('ans').disabled = true;
    $('q').innerHTML = `<b>${w.n} ${w.dir==='a'?'가로':'세로'}</b> · ${w.word}`;
    if (Object.keys(st.solved).length === words().length) { clearInterval(timer); render(); }
  } else {
    $('msg').textContent = [...v].length !== [...cur.word].length ? `${[...cur.word].length}글자 낱말입니다.` : '다시 생각해 봅시다.';
    $('msg').className = 'msg bad';
  }
}
$('check').onclick = check;
$('ans').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); check(); } });
$('hint').onclick = () => { if (!cur || st.solved[wid(cur)]) return; st.hints[wid(cur)] = 1; save(); const w = cur; render(); select(w); $('msg').textContent = `첫 글자는 ‘${[...w.word][0]}’입니다.`; };
$('reset').onclick = () => { if (!confirm('이 퍼즐을 처음부터 다시 합니까?')) return; st = { solved:{}, hints:{}, sec:0 }; save(); cur = null; $('ans').value=''; $('ans').disabled=false; $('msg').textContent=''; $('q').textContent='칸이나 단서를 누르고 답을 입력합니다.'; load(); };
$('reveal').onclick = () => { if (!confirm('모든 정답을 보여 줍니다. 계속합니까?')) return; words().forEach((w) => st.solved[wid(w)] = 1); save(); clearInterval(timer); cur = null; render(); };
$('themeBtn').onclick = () => { const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; store.set('democ-cw-theme', r.dataset.theme); };
const th = store.get('democ-cw-theme'); if (th) document.documentElement.dataset.theme = th;
window.addEventListener('resize', () => { clearTimeout(window.__rz); window.__rz = setTimeout(render, 150); });
load();
</script>

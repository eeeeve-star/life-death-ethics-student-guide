<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>자연과 윤리 - 형성평가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#F2F4F1;
    --surface:#FFFFFF;
    --surface-soft:#E9EDE9;
    --ink:#1C2321;
    --ink-soft:#5B665F;
    --border:#DCE3DE;
    --accent:#1F6F63;
    --accent-ink:#0E3B34;
    --accent-soft:#E1EFEB;
    --good:#2E7D53;
    --good-soft:#E4F3E9;
    --bad:#C1443A;
    --bad-soft:#FBE7E4;
    --shadow:rgba(28,35,33,0.10);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141F1B;
      --surface:#1C2A25;
      --surface-soft:#233129;
      --ink:#EAF1EC;
      --ink-soft:#9FB4AA;
      --border:#324139;
      --accent:#63CDB6;
      --accent-ink:#DFF7F0;
      --accent-soft:#20342E;
      --good:#74CE9B;
      --good-soft:#1E3527;
      --bad:#E8867B;
      --bad-soft:#3B2622;
      --shadow:rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#141F1B;
    --surface:#1C2A25;
    --surface-soft:#233129;
    --ink:#EAF1EC;
    --ink-soft:#9FB4AA;
    --border:#324139;
    --accent:#63CDB6;
    --accent-ink:#DFF7F0;
    --accent-soft:#20342E;
    --good:#74CE9B;
    --good-soft:#1E3527;
    --bad:#E8867B;
    --bad-soft:#3B2622;
    --shadow:rgba(0,0,0,0.35);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans KR", "Malgun Gothic", sans-serif;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding:32px 16px 56px;
  }
  .app{ width:100%; max-width:520px; }

  .eyebrow{
    font-family:"Noto Sans KR", "IBM Plex Mono", ui-monospace, monospace;
    font-size:12.5px;
    letter-spacing:.02em;
    color:var(--accent);
    font-weight:700;
    margin:0 0 6px;
  }
  h1.title{
    font-family:"Gowun Batang", serif;
    font-size:clamp(24px,6.5vw,32px);
    line-height:1.3;
    margin:0 0 8px;
    text-wrap:balance;
  }
  p.lede{
    color:var(--ink-soft);
    margin:0 0 24px;
    font-size:14.5px;
    line-height:1.6;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:24px;
    box-shadow:0 10px 28px -18px var(--shadow);
  }
  .card + .card{ margin-top:16px; }

  label.field-label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:8px;
  }

  .passage-label-row{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .field-hint{ font-size:12px; color:var(--ink-soft); }
  .passage-box{
    max-height:260px;
    overflow-y:auto;
    background:var(--bg);
    border:1.5px solid var(--border);
    border-radius:12px;
    padding:16px;
  }
  .passage-box.expanded{ max-height:none; }
  .passage-box p{
    font-size:14px;
    line-height:1.75;
    margin:0 0 12px;
    color:var(--ink);
  }
  .passage-box p:last-child{ margin-bottom:0; }
  .passage-toggle-btn{
    background:none;
    border:1.5px solid var(--border);
    color:var(--accent-ink);
    font-size:12.5px;
    font-weight:700;
    padding:6px 12px;
    border-radius:999px;
    cursor:pointer;
  }
  .passage-toggle-btn:hover{ background:var(--accent-soft); border-color:var(--accent); }

  .diff-row{
    display:flex;
    gap:8px;
    margin-top:8px;
  }
  .diff-pill{
    flex:1;
    text-align:center;
    padding:11px 8px;
    border-radius:11px;
    border:1.5px solid var(--border);
    background:var(--bg);
    color:var(--ink-soft);
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    user-select:none;
  }
  .diff-pill.active{
    border-color:var(--accent);
    background:var(--accent-soft);
    color:var(--accent-ink);
  }
  .diff-pill:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .field-block{ margin-bottom:20px; }
  .field-block:last-child{ margin-bottom:0; }

  button{ font-family:inherit; }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    padding:14px 16px;
    border-radius:12px;
    font-size:15.5px;
    font-weight:700;
    border:1.5px solid transparent;
    cursor:pointer;
    min-height:48px;
  }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn-primary{ background:var(--accent); color:var(--surface); }
  .btn-primary:disabled{ background:var(--surface-soft); color:var(--ink-soft); cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--ink); border-color:var(--border); }
  .btn-ghost:hover{ background:var(--surface-soft); }
  .btn-row{ display:flex; gap:10px; margin-top:18px; }
  .btn-row > *{ flex:1; }
  .signature{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
    margin:20px 0 0;
  }

  /* quiz */
  .progress-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .progress-label{
    font-family:"IBM Plex Mono", monospace;
    font-variant-numeric:tabular-nums;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
  }
  .diff-tag{
    font-size:11.5px;
    font-weight:700;
    color:var(--accent-ink);
    background:var(--accent-soft);
    padding:3px 9px;
    border-radius:999px;
  }
  .progress-track{
    height:6px;
    border-radius:999px;
    background:var(--surface-soft);
    overflow:hidden;
    margin-bottom:16px;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    border-radius:999px;
    transition:width .25s ease;
  }
  .quiz-passage-wrap{ margin-bottom:18px; }
  .question-text{
    font-size:19px;
    font-weight:700;
    line-height:1.5;
    margin:0 0 20px;
    text-wrap:balance;
  }
  .options{ display:flex; flex-direction:column; gap:10px; margin-bottom:22px; }
  .option{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    text-align:left;
    padding:13px 14px;
    border-radius:13px;
    border:1.5px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    font-size:15px;
    line-height:1.5;
    cursor:pointer;
  }
  .option:hover{ background:var(--surface-soft); }
  body.suppress-hover .option:hover{ background:var(--surface); }
  .option:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .option.selected{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .option:disabled{ cursor:default; }
  .option:disabled:hover{ background:var(--surface); }
  .option.correct{ border-color:var(--good); background:var(--good-soft); }
  .option.wrong{ border-color:var(--bad); background:var(--bad-soft); }
  .option.correct:disabled:hover{ background:var(--good-soft); }
  .option.wrong:disabled:hover{ background:var(--bad-soft); }
  .option-mark{
    flex:0 0 auto;
    width:22px; height:22px;
    border-radius:50%;
    border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-family:"IBM Plex Mono", monospace;
    font-size:12px; font-weight:600;
    color:var(--ink-soft);
  }
  .option.selected .option-mark{
    border-color:var(--accent);
    background:var(--accent);
    color:var(--surface);
  }
  .option.correct .option-mark{
    border-color:var(--good);
    background:var(--good);
    color:var(--surface);
  }
  .option.wrong .option-mark{
    border-color:var(--bad);
    background:var(--bad);
    color:var(--surface);
  }
  .feedback-box{
    border-radius:12px;
    padding:14px 16px;
    margin:-6px 0 22px;
    border:1px solid;
  }
  .feedback-box.correct{ background:var(--good-soft); border-color:var(--good); }
  .feedback-box.wrong{ background:var(--bad-soft); border-color:var(--bad); }
  .feedback-label{ font-weight:700; font-size:14px; margin:0 0 6px; }
  .feedback-label.correct{ color:var(--good); }
  .feedback-label.wrong{ color:var(--bad); }
  .feedback-explain{ font-size:13.5px; line-height:1.6; color:var(--ink); margin:0; }
  .nav-row{ display:flex; gap:10px; }
  .nav-row > *{ flex:1; }

  /* result */
  .score-tile{
    text-align:center;
    padding:8px 8px 4px;
    margin-bottom:8px;
  }
  .score-number{
    font-family:"IBM Plex Mono", monospace;
    font-variant-numeric:tabular-nums;
    font-size:44px;
    font-weight:600;
    line-height:1;
    margin:0 0 6px;
  }
  .score-number.tier-good{ color:var(--good); }
  .score-number.tier-mid{ color:var(--ink); }
  .score-number.tier-bad{ color:var(--bad); }
  .score-caption{ color:var(--ink-soft); font-size:14px; margin:0; }
  .perfect-badge{
    display:inline-block;
    margin:14px 0 0;
    padding:6px 16px;
    border-radius:999px;
    background:var(--good-soft);
    color:var(--good);
    font-weight:700;
    font-size:14.5px;
  }
  .perfect-badge.encourage{
    background:var(--accent-soft);
    color:var(--accent-ink);
  }

  .review-item{
    padding:16px 16px 16px 18px;
    border:1px solid var(--border);
    border-left:4px solid var(--border);
    border-radius:12px;
    margin-bottom:12px;
    background:var(--surface);
  }
  .review-item.correct{ border-left-color:var(--good); }
  .review-item.wrong{ border-left-color:var(--bad); }
  .review-item:last-child{ margin-bottom:0; }
  .review-head{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:8px;
  }
  .review-index{
    font-family:"IBM Plex Mono", monospace;
    font-size:12px;
    color:var(--ink-soft);
    flex:0 0 auto;
  }
  .review-q{ font-weight:700; font-size:15px; line-height:1.5; }
  .review-chip{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:12px;
    font-weight:700;
    padding:3px 9px;
    border-radius:999px;
    margin:2px 6px 2px 0;
  }
  .review-chip.correct{ background:var(--good-soft); color:var(--good); }
  .review-chip.wrong{ background:var(--bad-soft); color:var(--bad); }
  .review-answers{ font-size:13.5px; color:var(--ink-soft); margin:6px 0; line-height:1.7; }
  .review-answers b{ color:var(--ink); font-weight:700; }
  .review-explain{
    font-size:13.5px;
    color:var(--ink-soft);
    line-height:1.6;
    margin:8px 0 0;
    padding-top:8px;
    border-top:1px dashed var(--border);
  }
  .review-explain b{ color:var(--ink); }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function(){
  var app = document.getElementById('app');

  var TITLE = '자연과 윤리';
  var SUBTITLE = '현대사회와 윤리';
  var UNIT = 'II. 생명윤리와 생태윤리';
  var SIGNATURE = '현대사회와 윤리 수강 2학년♥무늬T';

  var PASSAGE_PARAGRAPHS = [
    '전통적으로 동양에서는 인간과 자연의 조화로운 삶을 강조하였다. 자연과 인간은 상호 의존적인 관계로 서로 긴밀하게 연결되어 있다고 보았다. 유교는 자연과 인간이 하나가 되는 천인합일(天人合一)의 경지를 지향하였다. 자연과 인간을 하나의 유기체로 파악하고, 인간과 만물은 조화를 이루며 더불어 사는 존재라고 보았다. 불교는 연기적 세계관에 따라 인간과 자연을 파악하였다. 하나의 그물망 안에 연결된 만물은 상호 의존하고 있으므로 자타불이(自他不二)의 정신으로 자비를 베풀어야 한다고 주장하였다. 도가는 자연에 대한 인위적인 행위를 자제하고, 자연의 순리에 따라 살아야 한다고 강조하였다. 노자는 무위자연(無爲自然)의 삶을 지향하였고, 장자는 인간을 포함한 만물이 타고난 그대로 모두 평등하므로 자연을 인위적으로 조작해서는 안 된다고 보았다.',
    '전통적으로 서양에서는 자연을 인간의 목적을 달성하기 위한 수단으로 여겼다. 고대 그리스 사상이나 그리스도교에서는 자연을 규칙적이고 합리적인 것으로 이해하였으며, 인간 중심적 관점에서 바라보았다. 아리스토텔레스는 "식물은 동물을 위해 존재하고, 동물은 인간을 위해 존재한다."라고 말하였으며, 아퀴나스는 "신의 섭리에 따라 동물은 자연의 과정에서 인간이 사용하도록 운명 지어졌다."라고 주장하였다. 이러한 생각은 근대 이후 자연 과학의 발달과 함께 자연을 정복의 대상으로 보는 관점에 영향을 미쳤다.',
    '[동양의 자연관 원전] 왕수인은 『대학문』에서 "대인(大人)은 천지 만물을 일체로 여긴다. 대인이 천지 만물을 일체로 여길 수 있는 것은 의도적으로 하는 것이 아니라, 그 마음의 인(仁)이 본래 이와 같아서 자연히 천지 만물과 일체가 되는 것이다."라고 하였다. 『화엄경』은 "인드라 하늘에는 진주 그물이 있고, 그 그물은 잘 정돈되어 있어 만일 사람이 어떤 하나의 진주를 주시한다면 그것 속에 다른 모든 것이 반영되어 있는 것을 볼 것이다. 이와 같이 이 세계 내의 각각의 대상들은 단지 그것 자체로서가 아니라 다른 모든 대상들을 서로서로 포함한다."라며 인드라망의 비유로 상호 의존을 설명하였다. 노자는 『도덕경』에서 "사람은 땅을 본받고, 땅은 하늘을 본받고, 하늘은 도를 본받고, 도는 자연을 본받는다."라고 하였다.',
    '유교, 불교, 도가의 자연관은 각각 차이는 있지만 대체로 인간과 자연의 조화로운 관계를 중시하는 모습을 보여 주었다. 유교는 하늘과 땅을 기계적 물체가 아니라 서로 느끼고 상응하면서 만물을 낳고 기르는 존재, 즉 유기체적 존재로 보았다. 불교는 하나의 작은 티끌에도 온 세계가 나타난다는 화엄의 세계를 인드라망의 비유를 통해 설명하였다. 도가는 아무런 외부적 힘이 관여하지 않은 자연 그대로의 성질, 스스로 그러한 모습[自然]을 본받는 것이 도(道)이며, 그러한 도에 따라 살아갈 것을 제안하였다. 이러한 동양의 자연관은 서양의 인간중심적 자연관이 갖는 문제점을 보완할 수 있다.',
    '인간중심주의는 도덕적 고려의 대상을 인간으로 한정하고, 인간 이외의 모든 존재는 인간의 목적을 위한 단순한 수단으로 이용될 수 있다고 여긴다. 서양의 근대 사상가들은 인간과 자연의 관계를 이분법적으로 설정하거나 기계론적 입장에서 자연을 바라보고 개발하고자 하였다. 베이컨(1561~1626)은 "자연에 대해 아는 것이 곧 힘이다."라고 주장하며 자연에 관한 지식의 활용을 주장하였다. 데카르트(1596~1650)는 심신 이원론(마음과 몸을 서로 다른 근원을 가진 별개의 실체로 보는 것으로, 마음의 근원은 생각이고 몸의 근원은 크기와 운동이라고 봄)에 입각하여 인간과 자연의 관계를 설명하였다. 이성적인 인간은 생각하는 주체이고, 물질적인 객체로서의 자연은 단순한 기계로 본 것이다. 그는 인류의 복리를 위해 자연을 적극적으로 이용해야 한다고 주장하며, 동물을 포함한 자연을 도덕적 고려의 대상에서 제외하였다. 이러한 서양의 자연관을 강경한 인간중심주의라고 하는데, 오늘날 자원 고갈과 생태계 파괴, 기후 위기 등을 불러온 원인으로 비판받고 있다.',
    '한편 칸트는 인간 이외의 존재는 이성이 없어 도덕적인 지위를 갖지 못한다고 보았다. 다만 자연을 잔인하게 다루는 것은 인간의 자신에 대한 의무에 어긋난다고 주장하며("자연을 파괴하고자 하는 성향은 도덕성에 기여할 감정을 약화시키거나 제거하기 때문이다.") 자연과 관련한 인간의 간접적 의무를 인정하였다.',
    '온건한 인간중심주의는 전통적인 인간중심주의가 자연의 개발과 이용에만 초점을 두었다는 반성에서 출발하였다. 이들은 기존의 인간중심주의적 관점을 강경한 입장이라고 비판하며 개발과 보존의 균형을 통해 자연과 인간이 함께 지속 가능할 수 있는 방법을 모색하고자 하였다. 패스모어(1914~2004)는 자연에 대한 인간의 도덕적 책임을 인정하고, 인류의 장기적인 이익과 생존을 위해 자연 친화적인 삶을 살 것을 주장하였다. 그는 "우리 자신이 계승했던 상황보다 지금과 같거나, 한층 더 훌륭한 상황을 우리의 직접적인 자손에게 양도해야 한다."라고 말하며 자연의 보전 문제에 관심을 기울였다. 다만 인간중심주의 사상가들은 대체로 자연 자체의 내재적 가치는 인정하지 않고, 인류의 장기적 이익이라는 관점에서만 자연을 대한다는 공통점이 있다.',
    '동물중심주의는 도덕적 고려의 대상을 동물에게까지 확대해야 한다고 본다. 대표적인 윤리 사상가로 싱어와 레건이 있다. 싱어는 "중요한 것은 이성을 갖는가 혹은 말할 수 있는가가 아니라 고통을 느낄 수 있는가이다."라는 벤담의 공리주의를 계승하였다. 그는 어떤 존재가 고통을 느낀다면 그 존재가 인간이든 동물이든 관계없이 도덕적 고려의 대상으로 삼아야 한다고 보았다. 이익 평등 고려의 원칙은 한 존재의 고통을 다른 존재의 고통과 동등하게 취급할 것을 요구하기 때문이다. 이를 위반하는 것은 종차별주의(자신이 속한 종의 이익을 다른 종의 이익보다 우선하는 태도를 인종 차별주의·성차별주의에 빗댄 말)에 해당한다고 본 싱어는, 쾌고 감수 능력이 어떤 존재를 도덕적으로 고려할지를 결정하는 유일한 기준이라고 주장하였다.',
    '레건은 한 살 이상의 포유동물들이 삶의 주체로서 도덕적으로 존중받을 권리가 있다고 주장하였다. 이때 삶의 주체라는 것은 단지 살아 있다는 것, 또는 단지 의식을 갖고 있다는 것 이상을 의미한다. 삶의 주체가 된다는 것은 믿음, 욕구, 지각, 기억, 미래에 대한 의식, 쾌락과 고통 등의 감정을 느낄 수 있다는 것이다. 그는 일부 동물을 자원으로 보는 것이 근본적으로 잘못되었음을 지적하며 무분별한 공장식 축산과 동물 실험 등에 반대하였다. 이후 동물 실험에는 대체(Replacement, 대체 방법 우선 고려), 축소(Reduction, 불가피한 경우 최소한으로 줄임), 개선(Refinement, 최대한 고통을 완화하는 방법으로 실시)이라는 3R 원칙이 강조되었다.',
    '동물중심주의는 인간의 이윤 추구를 위해 동물을 무분별하게 이용해 온 관행을 비판적으로 성찰하는 계기를 마련해 주었다. 특히 동물 실험에 대한 논쟁에 중요한 윤리적 근거를 마련해 주었다. 그러나 동물의 복지에 초점을 맞춘 논의에만 치중해 환경 문제 전체를 다루지 못한다는 비판도 받는다.',
    '생명중심주의는 도덕적 고려의 대상을 모든 생명체로 확대해야 한다고 보는 입장이다. 대표적인 윤리 사상가로 슈바이처와 테일러가 있다. 슈바이처(1875~1965)는 인간은 다른 모든 생명 의지에 대해서도 자신의 생명 의지를 대할 때와 마찬가지로 생명에 대해 외경심을 가져야 한다고 주장하였다. 그는 "인간은 다른 모든 생명에 대해 외경심을 가져야 한다. 선이란 생명을 유지하고 촉진하는 것이며, 악이란 생명을 파괴하고 저해하는 것이다. 이것이야말로 도덕의 절대적 기본적인 원리이다."라고 말하였다.',
    '테일러는 모든 생명체가 자기 보존을 위한 목적 지향적 활동을 하는 목적론적 삶의 중심이 되는 존재라고 보았다. 그는 생명체가 자신의 생존을 유지하고, 종을 재생산하며, 변화하는 환경에 적응하여 생명 활동을 영위한다는 점에 주목하였다. 그래서 그는 모든 생명체를 본래적 가치를 지닌 도덕적 고려의 대상으로 대우해야 한다고 주장하며 생명체에 대한 네 가지 의무를 제시하였다: ① 악행 금지의 의무(어떤 생명체도 해치지 않아야 함), ② 불간섭의 의무(개별 유기체의 자유를 제한하지 말고 생태계에 간섭하지 않아야 함), ③ 성실의 의무(인간의 즐거움을 위해 야생 동물을 사냥하거나 덫을 놓는 등의 기만행위를 해서는 안 됨), ④ 보상적 정의의 의무(위 세 의무를 어겼을 때 이를 보상해야 함).',
    '생명중심주의는 모든 생명체의 고유한 가치를 일깨워 주는 데 큰 역할을 하였다. 그러나 한편으로는 종이나 생태계와 같이 전체론적 관점에서 환경 문제를 바라보지 못했다는 비판을 받기도 한다.',
    '생태중심주의는 기존의 자연관들이 개별 생명체의 도덕적 지위를 중시한 것과 달리, 전일론적 관점에서 자연을 바라보고자 한다. 그래서 무생물을 포함한 생태계 전체를 도덕적 고려의 대상으로 여긴다. 대표적인 윤리 사상가로 레오폴드와 네스가 있다. 레오폴드(1887~1948)는 흙, 물, 식물과 동물 등을 포함한 대지를 도덕 공동체의 범위에 포함하는 대지 윤리를 주장하였다. 그는 인간을 대지 공동체의 정복자에서 그 구성원으로 변화시켜야 하고, 공동체의 구성원으로서 인간은 동료인 생명체와 전체 공동체에 대해 존경심을 가져야 한다고 강조하였다. 그는 어떤 것이 생명 공동체의 온전성, 안전성, 아름다움을 보전하는 경향이 있다면 옳고, 그렇지 않다면 그르다고 보았다.',
    '네스(1912~2009)는 환경 오염과 자원 고갈의 문제에 집중하는 이전의 생태주의를 인간 중심적이라고 비판하면서 근본적인 변화와 실천을 요구하는 심층 생태주의를 주장하였다. 그는 생태계의 위기를 극복하기 위해서는 인간의 세계관과 삶의 방식 자체를 생태 중심적으로 바꾸어야 한다고 주장하였다. 그러면서 그는 자신을 자연이라는 더 큰 전체와의 상호 연관성을 통해 이해하는 큰 자아실현과, 모든 생명체를 상호 연결된 공동체의 평등한 구성원으로 이해하는 생명 중심적 평등을 강조하였다.',
    '생태중심주의는 생태계와 생명체 전반에 대한 포괄적인 이해를 바탕으로 윤리적 실천을 하고자 노력했다는 점에서 의의가 있다. 하지만 대지 윤리나 심층 생태주의 모두 생명 공동체의 선을 위해 개별 생명, 특히 인간의 희생을 정당화할 위험성이 있다. 또한 생태계의 자연적 사실로부터 생태계의 규범적 가치를 도출함으로써 자연주의적 오류를 범하고 있다는 비판을 받기도 한다.',
    '[자연과 인간의 바람직한 관계] 오늘날 환경 문제의 근본적인 원인은 인간과 자연을 이분법적으로 나누고, 인간의 욕구 충족을 위해 자연을 지배하고 정복하려는 인간중심주의에서 찾을 수 있다. 인간은 생존하고 발전하기 위해서는 어쩔 수 없이 자연을 이용할 수밖에 없지만, 동시에 자연의 영향 속에서 살아가는 생태계의 구성원이다. 따라서 필요에 따라 자연을 개발하더라도 인간의 욕구를 적절하게 조절해 개발이 생태계에 미칠 부정적 영향을 최소화해야 한다. 이런 점에서 인간과 자연의 조화로운 공존을 추구한 동양의 자연관은 인간중심주의의 한계를 극복하는 데 도움을 줄 수 있다.',
    '그렇다면 인간과 자연의 조화로운 공존을 추구하기 위해서는 어떤 노력이 필요할까? 먼저 인간은 생태계의 한 구성원으로서 자연과 더불어 살아가는 존재라는 환경친화적인 가치관을 확립해야 한다. 또한 효율성과 경제성보다는 자연과 인간의 공생을 중시하는 사회적 노력이 확대되어야 한다. 이를 위해 개발로 인한 환경·생태적 부작용을 최소화하기 위한 제도적 차원의 지원이 필요하다.',
    '[미래 세대에 대한 인간의 예견적 책임] 요나스는 과학기술 시대의 책임 윤리를 제시하면서, 책임의 범위를 현세대로 한정하는 기존의 전통적 윤리는 환경 위기의 문제를 해결하는 데 한계가 있다고 보았다. 그는 윤리적 책임의 범위를 확대해 인간뿐만 아니라 자연과 미래 세대에 대한 예견적 책임까지 고려해야 한다고 보고, 다음과 같은 ‘생태학적 정언 명령’을 주장하였다. "네 행위의 결과가 지상에서의 진정한 인간적 삶의 지속과 조화될 수 있도록 하라." "네 행위의 결과가 미래에 인간의 생존 가능성을 파괴하지 않도록 하라." (요나스, 『책임의 원칙』)',
    '요나스는 우리의 행위가 영향을 미치게 될 자연과 미래 세대에 대해 책임을 강조하였다. 이 책임은 이미 일어난 결과에 대한 사후적 책임이 아니라 해야 할 것에 대한 예방적이며 사전적 책임이다. 그는 이 생태학적 정언 명령에 따라 행위할 때 미래 세대와 생태계 전체가 존속할 수 있다고 말하였다.',
    '["모든 생명체는 목적론적 삶의 중심이다"] 테일러는 인간 중심 환경 윤리의 시각을 비판하면서 생명중심주의적 관점을 체계적으로 정립하였다. 그에 따르면 이제까지 인간은 다른 동물이나 식물이 지니지 못한 인간만의 특징을 이유로 인간을 우월한 존재로 인식하면서, 인간에 대한 인간의 태도만을 윤리의 문제로 잘못 설정해 왔다. 그러나 다른 생명체에게는 비행, 속도, 광합성 능력 등 인간에게 없는 저마다의 능력이 있으며, 이런 능력보다 인간의 능력이 우월하다는 생각은 자의적인 인간중심주의적 사고에 불과하다고 비판하였다. 목적론적 삶의 중심이라는 것은 외적 활동뿐 아니라 내적 기능도 모두 목표 지향적이고, 시간이 지나도 유기체의 존재를 유지하며 같은 종을 재생산하고 변화하는 환경에 끊임없이 적응하는 지속적인 생물적 기능이 있다는 것이다. 의식이 있든 없든 모든 유기체는 자신의 존재를 지키고 유지하는 지속적인 경향이 있으며, 목표 지향적으로 활동하는 통일되고 일관성 있고 질서 정연한 시스템이라는 의미에서 목적론적 삶의 중심이다.',
    '테일러는 자연 존중 태도를 이해시키고 정당화하는 배경이 되는 생명 중심 관점의 핵심 믿음으로 다음 네 가지를 제시하였다: 인간은 지구 생명 공동체의 일원이다, 인간은 다른 모든 종들과 함께 상호 의존하는 시스템(자연계)을 구성하는 요소이다, 모든 유기체는 각각 자신의 방식대로 고유의 선을 추구하는 유일한 개체라는 의미에서 목적론적 삶의 중심이다, 인간은 다른 생명체보다 본질적으로 우월하지 않다(『자연에 대한 존중』). 그에 따르면 자연 생태계의 야생 동식물도 수단적인 효용성의 가치와 무관하게 본래적 가치를 지니며, 개별 생명체는 인간처럼 자기 보존을 추구하는 자율적 선택의 목적론적 중심이자 그 자체로 하나의 목적이기 때문에 도덕적 지위를 지닌다. 그래서 그는 모든 생명체가 이성적 사고 능력이나 도덕적 행위 능력이 없다 하더라도, 인간에게 얼마나 유용한지와 관계없이 도덕적으로 존중받아야 한다고 주장하였다.'

      { q: '종차별주의(speciesism)의 의미로 가장 적절한 것은?', options: ['자신이 속한 종의 이익을 다른 종보다 우선하는 태도', '인종에 따라 차별하는 태도', '성별에 따라 차별하는 태도', '생태계를 도덕적으로 고려하는 태도'], explain: '종차별주의는 자신이 속한 종의 이익을 다른 종의 이익보다 우선하는 태도를 가리킨다.' },
      { q: '데카르트의 심신 이원론에 따르면 자연은 어떤 존재로 여겨지는가?', options: ['단순한 기계적 물질', '도덕적 고려의 대상', '인간과 동등한 이성적 주체', '도덕 공동체의 구성원'], explain: '데카르트는 물질적 객체로서의 자연을 단순한 기계로 보았다.' },
      { q: '아퀴나스의 주장과 가장 유사한 입장은?', options: ['신의 섭리에 따라 자연은 인간을 위해 존재한다', '동물도 삶의 주체로서 권리를 가진다', '생태계 전체가 도덕적 고려 대상이다', '자연에 내재적 가치가 있다'], explain: '아퀴나스는 신의 섭리에 따라 동물이 인간에게 사용되도록 운명 지어졌다고 주장하였다.' },
      { q: '온건한 인간중심주의와 생명중심주의의 차이로 옳은 것은?', options: ['온건한 인간중심주의는 인류의 장기적 이익을, 생명중심주의는 생명체의 본래적 가치를 근거로 삼는다', '둘 다 인간의 이익만을 근거로 한다', '둘 다 생태계 전체를 도덕적으로 고려한다', '둘 다 동물 실험에 반대한다'], explain: '온건한 인간중심주의는 인류의 장기적 이익을, 생명중심주의(테일러)는 생명체의 본래적 가치를 도덕적 고려의 근거로 삼는다.' },
      { q: '테일러가 제시한 생명 중심 관점의 믿음으로 옳지 않은 것은?', options: ['인간은 다른 생명체보다 본질적으로 우월하다', '인간은 지구 생명 공동체의 일원이다', '인간은 다른 종들과 상호 의존하는 시스템을 구성하는 요소이다', '모든 유기체는 저마다의 방식으로 선을 추구하는 목적론적 삶의 중심이다'], explain: '테일러는 오히려 인간이 다른 생명체보다 본질적으로 우월하지 않다고 보았다.' }
    ]
  };

  var state = {
    screen: 'setup', // setup | quiz | result
    difficulty: '보통',
    questionCount: 5,
    questions: [],
    answers: [],
    current: 0,
    showPassage: false
  };

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  function passageHtml(){
    return PASSAGE_PARAGRAPHS.map(function(p){
      return '<p>' + escapeHtml(p) + '</p>';
    }).join('');
  }

  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function pickQuizSet(difficulty, count){
    var pool = shuffle(QUESTION_BANK[difficulty]);
    return pool.slice(0, count).map(function(item){
      var order = shuffle([0, 1, 2, 3]);
      var options = order.map(function(i){ return item.options[i]; });
      return {
        question: item.q,
        options: options,
        answerIndex: order.indexOf(0),
        explanation: item.explain
      };
    });
  }

  function startQuiz(){
    state.questions = pickQuizSet(state.difficulty, state.questionCount);
    state.answers = new Array(state.questions.length).fill(null);
    state.current = 0;
    state.showPassage = false;
    state.screen = 'quiz';
    render();
  }

  function selectOption(i){
    if (state.answers[state.current] !== null) return;
    state.answers[state.current] = i;
    render();
  }
  function goPrev(){
    if (state.current > 0){ state.current--; render(); }
  }
  function goNext(){
    if (state.current < state.questions.length - 1){
      state.current++;
      render();
    } else {
      state.screen = 'result';
      render();
    }
  }
  function backToSetup(){
    state.questions = [];
    state.answers = [];
    state.current = 0;
    state.screen = 'setup';
    render();
  }
  function retrySameQuiz(){
    startQuiz();
  }
  function togglePassage(){
    state.showPassage = !state.showPassage;
    render();
  }

  function renderSetupScreen(){
    var diffs = ['쉬움','보통','어려움'];
    var diffRow = diffs.map(function(d){
      return '<button type="button" class="diff-pill' + (state.difficulty === d ? ' active' : '') + '" data-diff="' + d + '">' + d + '</button>';
    }).join('');

    var counts = [5, 7, 10];
    var countRow = counts.map(function(n){
      return '<button type="button" class="diff-pill' + (state.questionCount === n ? ' active' : '') + '" data-count="' + n + '">' + n + '문제</button>';
    }).join('');

    app.innerHTML =
      '<p class="eyebrow">' + escapeHtml(SUBTITLE) + ' · ' + escapeHtml(UNIT) + '</p>' +
      '<h1 class="title">「' + escapeHtml(TITLE) + '」 퀴즈</h1>' +
      '<p class="lede">문제 수와 난이도를 골라서 풀어보세요. 파이팅!</p>' +
      '<div class="card">' +
        '<div class="field-block">' +
          '<label class="field-label">문제 수</label>' +
          '<div class="diff-row" id="count-row">' + countRow + '</div>' +
        '</div>' +
        '<div class="field-block">' +
          '<label class="field-label">난이도</label>' +
          '<div class="diff-row" id="diff-row">' + diffRow + '</div>' +
        '</div>' +
        '<button type="button" class="btn btn-primary" id="generate-btn">퀴즈 시작하기</button>' +
      '</div>' +
      '<p class="signature">' + escapeHtml(SIGNATURE) + '</p>';

    var diffRowEl = document.getElementById('diff-row');
    diffRowEl.addEventListener('click', function(ev){
      var btn = ev.target.closest('.diff-pill');
      if (!btn) return;
      state.difficulty = btn.getAttribute('data-diff');
      diffRowEl.querySelectorAll('.diff-pill').forEach(function(p){
        p.classList.toggle('active', p === btn);
      });
    });
    var countRowEl = document.getElementById('count-row');
    countRowEl.addEventListener('click', function(ev){
      var btn = ev.target.closest('.diff-pill');
      if (!btn) return;
      state.questionCount = parseInt(btn.getAttribute('data-count'), 10);
      countRowEl.querySelectorAll('.diff-pill').forEach(function(p){
        p.classList.toggle('active', p === btn);
      });
    });
    document.getElementById('generate-btn').addEventListener('click', function(){
      startQuiz();
    });
  }

  function renderPassageToggle(){
    return '<div class="quiz-passage-wrap">' +
      '<button type="button" class="passage-toggle-btn" id="passage-toggle-btn">' + (state.showPassage ? '교과서 접기' : '교과서 보기') + '</button>' +
      (state.showPassage ? '<div class="passage-box expanded" style="margin-top:10px;">' + passageHtml() + '</div>' : '') +
    '</div>';
  }

  function renderQuizScreen(){
    var total = state.questions.length;
    var q = state.questions[state.current];
    var selected = state.answers[state.current];
    var answered = selected !== null;
    var isLast = state.current === total - 1;
    var pct = Math.round(((state.current) / total) * 100);
    var isCorrect = answered && selected === q.answerIndex;

    var optionsHtml = q.options.map(function(opt, i){
      var marks = ['A','B','C','D'];
      var cls = 'option';
      if (answered){
        if (i === q.answerIndex) cls += ' correct';
        else if (i === selected) cls += ' wrong';
      } else if (selected === i){
        cls += ' selected';
      }
      return '<button type="button" class="' + cls + '" data-opt="' + i + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="option-mark">' + marks[i] + '</span>' +
        '<span>' + escapeHtml(opt) + '</span>' +
      '</button>';
    }).join('');

    var feedbackHtml = answered
      ? '<div class="feedback-box ' + (isCorrect ? 'correct' : 'wrong') + '">' +
          '<p class="feedback-label ' + (isCorrect ? 'correct' : 'wrong') + '">' + (isCorrect ? '정답이에요!' : '오답이에요') + '</p>' +
          '<p class="feedback-explain">' + escapeHtml(q.explanation) + '</p>' +
        '</div>'
      : '';

    app.innerHTML =
      '<div class="card">' +
        '<div class="progress-row">' +
          '<span class="progress-label">질문 ' + (state.current + 1) + ' / ' + total + '</span>' +
          '<span class="diff-tag">' + escapeHtml(state.difficulty) + '</span>' +
        '</div>' +
        '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
        renderPassageToggle() +
        '<p class="question-text">' + escapeHtml(q.question) + '</p>' +
        '<div class="options">' + optionsHtml + '</div>' +
        feedbackHtml +
        '<div class="nav-row">' +
          '<button type="button" class="btn btn-ghost" id="prev-btn"' + (state.current === 0 ? ' disabled' : '') + '>이전</button>' +
          '<button type="button" class="btn btn-primary" id="next-btn"' + (answered ? '' : ' disabled') + '>' + (isLast ? '결과 보기' : '다음 문제') + '</button>' +
        '</div>' +
      '</div>';

    if (!answered){
      app.querySelectorAll('.option').forEach(function(btn){
        btn.addEventListener('click', function(){
          selectOption(parseInt(btn.getAttribute('data-opt'), 10));
        });
      });
    }
    document.getElementById('passage-toggle-btn').addEventListener('click', togglePassage);
    document.getElementById('prev-btn').addEventListener('click', goPrev);
    document.getElementById('next-btn').addEventListener('click', goNext);
  }

  function renderResultScreen(){
    var total = state.questions.length;
    var score = 0;
    state.questions.forEach(function(q, i){
      if (state.answers[i] === q.answerIndex) score++;
    });
    var tier = score >= Math.ceil(total * 0.8) ? 'tier-good' : (score <= Math.floor(total * 0.4) ? 'tier-bad' : 'tier-mid');
    var pctText = Math.round((score / total) * 100) + '점';

    var items = state.questions.map(function(q, i){
      var mine = state.answers[i];
      var correct = mine === q.answerIndex;
      var marks = ['A','B','C','D'];
      return '<div class="review-item ' + (correct ? 'correct' : 'wrong') + '">' +
        '<div class="review-head">' +
          '<span class="review-index">Q' + (i + 1) + '</span>' +
          '<span class="review-q">' + escapeHtml(q.question) + '</span>' +
        '</div>' +
        '<span class="review-chip ' + (correct ? 'correct' : 'wrong') + '">' + (correct ? '정답' : '오답') + '</span>' +
        '<div class="review-answers">' +
          '내 답: <b>' + marks[mine] + '. ' + escapeHtml(q.options[mine]) + '</b>' +
          (correct ? '' : '<br>정답: <b>' + marks[q.answerIndex] + '. ' + escapeHtml(q.options[q.answerIndex]) + '</b>') +
        '</div>' +
        '<p class="review-explain"><b>해설</b> ' + escapeHtml(q.explanation) + '</p>' +
      '</div>';
    }).join('');

    var encourageText = score === total ? '참 잘했어요!'
      : tier === 'tier-good' ? '잘했어요! 틀린 문제만 다시 확인해볼까요?'
      : tier === 'tier-mid' ? '좋아요! 틀린 문제를 다시 살펴봐요.'
      : '한 번 더 도전해봐요!';
    var perfectHtml = '<p class="perfect-badge' + (score === total ? '' : ' encourage') + '">' + encourageText + '</p>';

    app.innerHTML =
      '<p class="eyebrow">채점 결과</p>' +
      '<h1 class="title">"' + escapeHtml(TITLE) + '" 퀴즈 결과</h1>' +
      '<div class="card">' +
        '<div class="score-tile">' +
          '<p class="score-number ' + tier + '">' + score + '/' + total + '</p>' +
          '<p class="score-caption">' + total + '문제 중 ' + score + '개 정답 · ' + pctText + '</p>' +
          perfectHtml +
        '</div>' +
      '</div>' +
      '<div class="card" style="margin-top:16px;">' + renderPassageToggle() + items + '</div>' +
      '<div class="btn-row">' +
        '<button type="button" class="btn btn-primary" id="retry-btn">다시 풀기</button>' +
        '<button type="button" class="btn btn-ghost" id="reset-btn">난이도 다시 선택</button>' +
      '</div>' +
      '<p class="signature">' + escapeHtml(SIGNATURE) + '</p>';

    var toggleBtn = document.getElementById('passage-toggle-btn');
    if (toggleBtn) toggleBtn.addEventListener('click', togglePassage);
    document.getElementById('retry-btn').addEventListener('click', retrySameQuiz);
    document.getElementById('reset-btn').addEventListener('click', backToSetup);
  }

  function suppressHoverUntilMove(){
    document.body.classList.add('suppress-hover');
    document.addEventListener('mousemove', function onMove(){
      document.body.classList.remove('suppress-hover');
      document.removeEventListener('mousemove', onMove);
    }, { once: true });
  }

  function render(){
    suppressHoverUntilMove();
    if (state.screen === 'setup') renderSetupScreen();
    else if (state.screen === 'quiz') renderQuizScreen();
    else if (state.screen === 'result') renderResultScreen();
  }

  render();
})();
</script>
</body>
</html>

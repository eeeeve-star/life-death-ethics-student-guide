<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>민주시민과 윤리 - 형성평가</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#FDEBE4;
    --surface:#FFFFFF;
    --surface-soft:#FBE4DB;
    --ink:#2A1A15;
    --ink-soft:#7A5A50;
    --border:#F1D2C6;
    --accent:#D2502F;
    --accent-ink:#7A2A17;
    --accent-soft:#FDE3D9;
    --good:#2E7D53;
    --good-soft:#E4F3E9;
    --bad:#A3264B;
    --bad-soft:#F8E1E8;
    --key:#C62828;
    --shadow:rgba(120,50,30,0.14);
    --bg-top:#F9D2C4; --stim-bg:#FFF6F2;
    /* 사상가 고정 색 */
    --c-hobbes:#5B8DEF; --c-locke:#2BB3A3; --c-rousseau:#F2795B; --c-rawls:#8B6FD6;
    --c-macintyre:#E0A526; --c-nozick:#E5609A; --c-thoreau:#4CAF50; --c-singer:#F39C34;
    --c-dworkin:#3F51B5; --c-kant:#3A6EA5; --c-beccaria:#20A4C4; --c-bentham:#7FA33A;
    --c-niebuhr:#8D6E63; --c-aristotle:#A1887F;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1F1310;
      --surface:#2B1C17;
      --surface-soft:#36241E;
      --ink:#F6E9E4;
      --ink-soft:#C4A49A;
      --border:#4A322A;
      --accent:#F08A6C;
      --accent-ink:#FFE3D9;
      --accent-soft:#3D251D;
      --good:#74CE9B;
      --good-soft:#1E3527;
      --bad:#F07A9A;
      --bad-soft:#3E1F29;
      --key:#FF8A80;
      --shadow:rgba(0,0,0,0.4);
    --bg-top:#3A221B; --stim-bg:#241713;
      --c-hobbes:#8FB2F5; --c-locke:#5FD3C5; --c-rousseau:#F7A28D; --c-rawls:#B4A0EC;
      --c-macintyre:#F0C35E; --c-nozick:#F08DB9; --c-thoreau:#7CCB7F; --c-singer:#F7B86A;
      --c-dworkin:#8C9AE6; --c-kant:#82AEDD; --c-beccaria:#62C8E0; --c-bentham:#AACB6C;
      --c-niebuhr:#BFA195; --c-aristotle:#C9B5AD;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1F1310;
    --surface:#2B1C17;
    --surface-soft:#36241E;
    --ink:#F6E9E4;
    --ink-soft:#C4A49A;
    --border:#4A322A;
    --accent:#F08A6C;
    --accent-ink:#FFE3D9;
    --accent-soft:#3D251D;
    --good:#74CE9B;
    --good-soft:#1E3527;
    --bad:#F07A9A;
    --bad-soft:#3E1F29;
    --key:#FF8A80;
    --shadow:rgba(0,0,0,0.4);
    --bg-top:#3A221B; --stim-bg:#241713;
    --c-hobbes:#8FB2F5; --c-locke:#5FD3C5; --c-rousseau:#F7A28D; --c-rawls:#B4A0EC;
    --c-macintyre:#F0C35E; --c-nozick:#F08DB9; --c-thoreau:#7CCB7F; --c-singer:#F7B86A;
    --c-dworkin:#8C9AE6; --c-kant:#82AEDD; --c-beccaria:#62C8E0; --c-bentham:#AACB6C;
    --c-niebuhr:#BFA195; --c-aristotle:#C9B5AD;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg) linear-gradient(180deg, var(--bg-top) 0, var(--bg) 360px) no-repeat;
    color:var(--ink);
    font-family:"Noto Sans KR", "Malgun Gothic", sans-serif;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    padding:32px 16px 56px;
  }
  .app{ width:100%; max-width:580px; min-width:0; }

  .eyebrow{
    font-family:"Noto Sans KR", "IBM Plex Mono", ui-monospace, monospace;
    font-size:12.5px;
    letter-spacing:.02em;
    color:var(--accent);
    font-weight:700;
    margin:0 0 6px;
  }
  h1.title{
    font-family:"Gowun Batang", serif;
    font-size:clamp(24px,6.5vw,32px);
    line-height:1.3;
    margin:0 0 8px;
    text-wrap:balance;
  }
  p.lede{
    color:var(--ink-soft);
    margin:0 0 24px;
    font-size:14.5px;
    line-height:1.6;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:24px;
    box-shadow:0 10px 28px -18px var(--shadow);
  }
  .card + .card{ margin-top:16px; }

  label.field-label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:8px;
  }

  .field-hint{ font-size:12px; color:var(--ink-soft); }
  .passage-box{
    max-height:260px;
    overflow-y:auto;
    background:var(--stim-bg);
    border:1.5px solid var(--border);
    border-radius:12px;
    padding:16px;
  }
  .passage-box.expanded{ max-height:none; }
  .passage-box p{
    font-size:14.5px;
    line-height:1.75;
    margin:0 0 12px;
    color:var(--ink);
    word-break:keep-all;
  }
  .passage-box p:last-child{ margin-bottom:0; }
  .passage-box h4{
    font-family:"Gowun Batang", serif;
    font-size:16px;
    margin:18px 0 6px;
    color:var(--accent-ink);
  }
  .passage-box h4:first-child{ margin-top:0; }
  .passage-toggle-btn{
    background:none;
    border:1.5px solid var(--border);
    color:var(--accent-ink);
    font-size:12.5px;
    font-weight:700;
    padding:6px 12px;
    border-radius:999px;
    cursor:pointer;
  }
  .passage-toggle-btn:hover{ background:var(--accent-soft); border-color:var(--accent); }

  .key{ color:var(--key); font-weight:700; }
  .who{ font-weight:700; }

  .diff-row{
    display:flex;
    gap:8px;
    margin-top:8px;
  }
  .diff-pill{
    flex:1;
    text-align:center;
    padding:11px 8px;
    border-radius:11px;
    border:1.5px solid var(--border);
    background:var(--stim-bg);
    color:var(--ink-soft);
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    user-select:none;
    line-height:1.4;
  }
  .diff-pill small{ display:block; font-size:12px; font-weight:700; opacity:.85; }
  .diff-pill.active{
    border-color:var(--accent);
    background:var(--accent-soft);
    color:var(--accent-ink);
  }
  .diff-pill:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .field-block{ margin-bottom:20px; }
  .field-block:last-child{ margin-bottom:0; }
  .set-desc{ font-size:13px; color:var(--ink-soft); line-height:1.6; margin:10px 2px 0; }

  button{ font-family:inherit; }
  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    padding:14px 16px;
    border-radius:12px;
    font-size:15.5px;
    font-weight:700;
    border:1.5px solid transparent;
    cursor:pointer;
    min-height:48px;
  }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn-primary{ background:var(--accent); color:var(--surface); }
  .btn-primary:disabled{ background:var(--surface-soft); color:var(--ink-soft); cursor:not-allowed; }
  .btn-ghost{ background:transparent; color:var(--ink); border-color:var(--border); }
  .btn-ghost:hover{ background:var(--surface-soft); }
  .btn-ghost:disabled{ color:var(--ink-soft); cursor:not-allowed; }
  .btn-ghost:disabled:hover{ background:transparent; }
  .btn-row{ display:flex; gap:10px; margin-top:18px; }
  .btn-row > *{ flex:1; }
  .signature{
    text-align:center;
    font-size:12.5px;
    color:var(--ink-soft);
    margin:20px 0 0;
  }

  /* quiz */
  .progress-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:10px;
  }
  .progress-label{
    font-family:"IBM Plex Mono", monospace;
    font-variant-numeric:tabular-nums;
    font-size:13px;
    font-weight:600;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .diff-tag{
    font-size:11.5px;
    font-weight:700;
    color:var(--accent-ink);
    background:var(--accent-soft);
    padding:3px 9px;
    border-radius:999px;
  }
  .progress-track{
    height:6px;
    border-radius:999px;
    background:var(--surface-soft);
    overflow:hidden;
    margin-bottom:16px;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    border-radius:999px;
    transition:width .25s ease;
  }
  .quiz-passage-wrap{ margin-bottom:18px; }
  .question-text{
    font-size:18.5px;
    font-weight:700;
    line-height:1.55;
    margin:0 0 16px;
    word-break:keep-all;
  }

  /* 제시문 */
  .stim{
    border:1.5px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    margin:0 0 18px;
    background:var(--stim-bg);
    font-size:15.5px;
    line-height:1.75;
    word-break:keep-all;
  }
  .stim p{ margin:0 0 10px; }
  .stim p:last-child{ margin-bottom:0; }
  .stim .u{ text-decoration:underline; text-underline-offset:3px; }
  .stim .src{ display:block; text-align:right; font-size:13px; color:var(--ink-soft); margin-top:2px; }
  .spk{ display:flex; gap:10px; align-items:flex-start; margin:0 0 12px; }
  .spk:last-child{ margin-bottom:0; }
  .spk-label{
    flex:0 0 auto;
    min-width:28px; height:28px;
    padding:0 6px;
    border-radius:8px;
    border:1.5px solid var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:14px;
    margin-top:1px;
    background:var(--surface);
  }
  .spk-body{ flex:1; min-width:0; }
  .bogi{
    margin-top:12px;
    border:1.5px solid var(--border);
    border-radius:10px;
    padding:22px 14px 12px;
    position:relative;
    background:var(--surface);
  }
  .bogi::before{
    content:"〈보기〉";
    position:absolute;
    top:-12px; left:50%;
    transform:translateX(-50%);
    background:var(--surface);
    padding:0 8px;
    font-size:13.5px;
    font-weight:700;
    color:var(--ink-soft);
    border-radius:6px;
  }
  .stim > .bogi:first-child{ margin-top:6px; }
  .bogi p{ margin:0 0 6px; padding-left:1.6em; text-indent:-1.6em; }
  .bogi p:last-child{ margin-bottom:0; }
  .case-title{ font-weight:700; color:var(--accent-ink); }

  .options{ display:flex; flex-direction:column; gap:10px; margin-bottom:22px; }
  .option{
    display:flex;
    align-items:flex-start;
    gap:12px;
    width:100%;
    text-align:left;
    padding:13px 14px;
    border-radius:13px;
    border:1.5px solid var(--border);
    background:var(--surface);
    color:var(--ink);
    font-size:16px;
    line-height:1.55;
    cursor:pointer;
    word-break:keep-all;
  }
  .option:hover{ background:var(--surface-soft); }
  body.suppress-hover .option:hover{ background:var(--surface); }
  .option:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .option.selected{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .option:disabled{ cursor:default; }
  .option:disabled:hover{ background:var(--surface); }
  .option.correct{ border-color:var(--good); background:var(--good-soft); }
  .option.wrong{ border-color:var(--bad); background:var(--bad-soft); }
  .option.correct:disabled:hover{ background:var(--good-soft); }
  .option.wrong:disabled:hover{ background:var(--bad-soft); }
  .option-mark{
    flex:0 0 auto;
    width:24px; height:24px;
    margin-top:1px;
    border-radius:50%;
    border:1.5px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    font-family:"IBM Plex Mono", monospace;
    font-size:12.5px; font-weight:600;
    color:var(--ink-soft);
  }
  .option.selected .option-mark{
    border-color:var(--accent);
    background:var(--accent);
    color:var(--surface);
  }
  .option.correct .option-mark{
    border-color:var(--good);
    background:var(--good);
    color:var(--surface);
  }
  .option.wrong .option-mark{
    border-color:var(--bad);
    background:var(--bad);
    color:var(--surface);
  }
  .feedback-box{
    border-radius:12px;
    padding:14px 16px;
    margin:-6px 0 22px;
    border:1px solid;
  }
  .feedback-box.correct{ background:var(--good-soft); border-color:var(--good); }
  .feedback-box.wrong{ background:var(--bad-soft); border-color:var(--bad); }
  .feedback-label{ font-weight:700; font-size:14.5px; margin:0 0 6px; }
  .feedback-label.correct{ color:var(--good); }
  .feedback-label.wrong{ color:var(--bad); }
  .feedback-explain{ font-size:14.5px; line-height:1.7; color:var(--ink); margin:0; word-break:keep-all; }
  .nav-row{ display:flex; gap:10px; }
  .nav-row > *{ flex:1; }

  /* result */
  .score-tile{
    text-align:center;
    padding:8px 8px 4px;
    margin-bottom:8px;
  }
  .score-number{
    font-family:"IBM Plex Mono", monospace;
    font-variant-numeric:tabular-nums;
    font-size:44px;
    font-weight:600;
    line-height:1;
    margin:0 0 6px;
  }
  .score-number.tier-good{ color:var(--good); }
  .score-number.tier-mid{ color:var(--ink); }
  .score-number.tier-bad{ color:var(--bad); }
  .score-caption{ color:var(--ink-soft); font-size:14px; margin:0; }
  .perfect-badge{
    display:inline-block;
    margin:14px 0 0;
    padding:6px 16px;
    border-radius:999px;
    background:var(--good-soft);
    color:var(--good);
    font-weight:700;
    font-size:14.5px;
  }
  .perfect-badge.encourage{
    background:var(--accent-soft);
    color:var(--accent-ink);
  }

  .review-item{
    padding:16px 16px 16px 18px;
    border:1px solid var(--border);
    border-left:4px solid var(--border);
    border-radius:12px;
    margin-bottom:12px;
    background:var(--surface);
  }
  .review-item.correct{ border-left-color:var(--good); }
  .review-item.wrong{ border-left-color:var(--bad); }
  .review-item:last-child{ margin-bottom:0; }
  .review-head{
    display:flex;
    align-items:baseline;
    gap:8px;
    margin-bottom:8px;
  }
  .review-index{
    font-family:"IBM Plex Mono", monospace;
    font-size:12px;
    color:var(--ink-soft);
    flex:0 0 auto;
  }
  .review-q{ font-weight:700; font-size:15.5px; line-height:1.5; word-break:keep-all; }
  .review-chip{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:12px;
    font-weight:700;
    padding:3px 9px;
    border-radius:999px;
    margin:2px 6px 2px 0;
  }
  .review-chip.correct{ background:var(--good-soft); color:var(--good); }
  .review-chip.wrong{ background:var(--bad-soft); color:var(--bad); }
  .review-answers{ font-size:14px; color:var(--ink-soft); margin:6px 0; line-height:1.7; word-break:keep-all; }
  .review-answers b{ color:var(--ink); font-weight:700; }
  .review-stim{ margin:8px 0 4px; }
  .review-stim summary{ cursor:pointer; font-size:13px; font-weight:700; color:var(--accent-ink); }
  .review-stim .stim{ margin:8px 0 0; font-size:14px; }
  .review-explain{
    font-size:14px;
    color:var(--ink-soft);
    line-height:1.7;
    margin:8px 0 0;
    padding-top:8px;
    border-top:1px dashed var(--border);
    word-break:keep-all;
  }
  .review-explain > b:first-child{ color:var(--ink); }

  @media (max-width:420px){
    .card{ padding:20px 16px; }
    .stim{ padding:12px 13px; font-size:15px; }
    .option{ font-size:15.5px; padding:12px; }
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function(){
  var app = document.getElementById('app');

  var TITLE = '민주시민과 윤리';
  var SUBTITLE = '현대사회와 윤리';
  var UNIT = 'Ⅳ. 민주시민과 윤리';
  var SIGNATURE = '현대사회와 윤리 수강 2학년♥무늬T♥';
  var MARKS = ['1','2','3','4','5'];
  var CIRCLED = ['①','②','③','④','⑤'];

  /* 사상가 이름 → 고정 색 (해설·교과서 보기에서 {이름}으로 표시) */
  var THINKER_VAR = {
    '홉스':'hobbes','로크':'locke','루소':'rousseau','롤스':'rawls','매킨타이어':'macintyre',
    '노직':'nozick','소로':'thoreau','싱어':'singer','드워킨':'dworkin','칸트':'kant',
    '베카리아':'beccaria','벤담':'bentham','니부어':'niebuhr','아리스토텔레스':'aristotle'
  };

  /* ───────── 교과서 보기 (세트별) ─────────
     [[단어]] = 학습지 빈칸 정답(빨간 글씨), {이름} = 사상가 고정 색 */
  var PASSAGES = {
    civic: [
      ['h','1. 시민과 국가의 관계'],
      ['p','민주 국가의 시민은 다양한 권리와 의무를 지닌다. 시민의 권리란 주권자로서 국가에 요구할 수 있는 권리로 자유권, 평등권, 참정권, 청구권, 사회권 등이 있고, 시민의 의무란 사회를 유지하고 공공복리를 증진하기 위해 수행해야 하는 책무로 납세·국방·교육·근로의 의무가 있다. 우리나라 헌법은 이외에도 환경 보전의 의무, 재산권 행사의 공공복리 적합 의무를 규정하고 있다.'],
      ['p','권리에는 의무가 수반되며, 의무는 개인의 [[권리]]를 전제하기 때문에 시민의 권리와 의무는 따로 떼어서 생각할 수 없다. 권리와 의무는 보완적인 관계이므로, 시민의 권리 행사와 의무 이행은 균형 있게 이루어져야 한다.'],
      ['p','국가의 권위란 국가가 시민들에게 명령을 내리고 통치할 수 있는 힘을 의미한다. {아리스토텔레스}에 따르면 인간은 사회적·정치적 동물이다. 국가는 인간의 [[본성]]에 의해 자연스럽게 형성된 것이므로 정당성을 갖는다(인간 본성의 관점).'],
      ['p','사회 계약론은 생명, 자유, 재산과 같은 권리를 보호받으려고 개인 간 국가를 형성하는 [[계약]]을 맺기 때문에, 시민은 국가에 복종하는 것에 동의한다고 본다. 이러한 국가는 철도, 전기, 국방, 교육, 치안 등 공공재를 제공하고, 공익을 위한 제도나 법률 같은 관행의 혜택을 제공하기 때문에 권위를 갖는다.'],
      ['p','유교는 나라의 근본을 백성에 두는 [[민본주의]] 정신을 강조한다. 유교에 따르면 군주가 덕을 갖추고 백성을 위한 통치를 해야만 국가의 권위가 정당화된다.'],
      ['p','[사회 계약론 비교] {홉스}: “자연 상태는 ‘만인의 만인에 대한 투쟁’ 상태야. 따라서 자기 보존을 위해서 계약을 맺고 국가를 형성하게 돼.” / {로크}: “내 생명과 재산을 보호받기 위해서는 자연 상태에서 가졌던 평등, 자유 및 집행권을 입법부가 처리할 수 있도록 사회의 수중에 양도해야 해. 그러나 정부가 이를 지키지 못하면 저항권을 행사할 수 있어.” / {루소}: “평화로운 자연 상태에서 사유 재산이 증가함에 따라 점차 불평등과 예속 상태에 놓이게 돼. 이를 벗어나기 위해 사회 계약을 맺고 국가를 형성하게 돼.”'],
      ['p','사회 계약론에 따르면 국가는 먼저 시민들의 기본권인 생명, 재산, 자유를 보호해야 한다. 또한 국가는 시민들이 인간다운 삶을 살아갈 수 있도록 실업이나 빈곤과 같은 어려움에 처한 사람들을 돕거나 출산 및 양육 등을 지원하는 사회 보장 제도를 제공해야 한다.'],
      ['h','2. 개인선과 공동선의 조화'],
      ['p','자유주의는 개인의 [[자유]]를 최상의 가치로 여기는 사상이다. 개인들은 이성적이고 합리적인 능력을 지녔기 때문에 인생의 목적이나 신념을 스스로 판단하고 선택할 수 있는 [[자율적]]인 존재로 본다. 따라서 사회나 국가는 개인의 자유와 권리 보호에 힘쓰면서 특정한 형태의 삶의 방식을 강요하지 않고 중립적이어야 한다고 본다. 그러나 자유주의가 지나치게 강조되면 자신의 의무와 공동선에 무관심해지는 문제가 생길 수 있다.'],
      ['p','공동체주의는 공동체의 문화와 역사, 전통과 규범 등을 중시하는 사상으로, 인간은 공동체 안에서 [[사회적 역할]]을 수행하면서 소속감과 자아 정체성을 형성하는 존재라고 본다. 개인의 사적인 권리보다 공동체 구성원으로서 갖춰야 할 덕목을 우선시하며, 연대 의식과 공동선을 강조한다. 그러나 공동체의 가치를 지나치게 우선시하면 권위주의나 전체주의로 흘러 개인의 자유와 권리를 침해할 수 있고, 개인을 사회나 집단의 존속과 발전을 위한 하나의 [[수단]]으로 취급하는 문제점이 나타날 수 있다.'],
      ['p','{롤스}: “모든 사람은 기본적 자유를 누릴 수 있는 평등한 권리를 가져야 합니다. 다수의 이익을 위해 개인의 기본적 자유가 침해되는 것은 허용되지 않습니다.” - 『정의론』 / {매킨타이어}: “나의 정체성은 공동체의 역사 속에서 만들어집니다. 나는 나의 가족, 나의 도시, 나의 부족, 나의 민족으로부터 다양한 빚과 유산, 정당한 기대와 의무를 물려받습니다. 따라서 공동체 구성원으로서 책임과 의무를 다해야 합니다.” - 『덕의 상실』'],
      ['p','개인선과 공동선은 항상 충돌하는 것이 아니며 상호 보완적 관계이다. 개인의 자유와 권리를 최대한 인정하는 동시에, 사회 전체의 공익을 지향함으로써 개인선과 공동선이 조화를 이룰 수 있어야 한다.'],
      ['h','3. 시민의 정치참여'],
      ['p','시민의 정치참여란 선거권을 행사하는 것뿐만 아니라 [[정책]]의 결정이나 집행에 직접 참여하여 영향을 미치는 것을 말한다. 정치참여를 통해 시민에 의한 정치를 실현하고, 공동선을 추구하며, 국가권력의 남용을 견제하고, 더 좋은 [[민주주의]]를 실현하는 토대를 마련할 수 있다.'],
      ['p','대부분의 현대 국가는 선거를 통해 선출한 대표가 시민의 정치적 의사를 대변하는 대의 민주주의를 채택하고 있다. 하지만 대의 민주주의는 대표자가 시민의 의사를 온전히 대표하기 어렵고, 다수 집단의 이익만을 대변하고 소수의 의견과 권리를 배제하여 사회통합을 저해할 수 있다. 이를 보완하기 위해 주민 소환제, 공청회, 청소년 참여 위원회, 인터넷을 통한 정책 제안 등을 활용할 수 있다.'],
      ['h','4. 시민불복종'],
      ['p','저항권 개념은 근대 사상가 [[로크]]에서부터 시작하였다. 그는 계약을 통해 자연권을 양도받은 국가가 시민들을 제대로 보호하지 못한다면 시민들은 계약을 파기하고 자기방어를 할 수 있다고 주장하였다. 저항권은 이후 시민불복종 운동에 영향을 주었다.'],
      ['p','시민불복종은 정의롭지 못한 법이나 정책을 변화시키려는 목적을 가지고 의도적으로 법을 위반하는 행위를 말한다. {소로}는 국가의 시민이기 이전에 먼저 인간이어야 하기 때문에, 법보다는 개인의 [[양심]]을 따라야 한다고 보았다. {롤스}는 개인의 양심보다 [[다수]]의 정의관에 초점을 맞추어, 어떤 법률이나 명령이 정의의 원칙을 심각하게 위반할 경우 최후의 수단으로 시민불복종을 할 수 있다고 주장하였다. {싱어}는 공리주의적 입장에서 시민불복종이 산출할 손해보다 [[이익]]이 더 큰 경우에 성공 가능성을 고려하여 이루어져야 한다고 주장하였다. {드워킨}은 헌법 정신에 어긋나는 법에 대해 자신의 자율적인 판단에 따라 시민불복종을 할 수 있다고 주장하였다.'],
      ['p','{롤스}가 제시한 시민불복종의 정당화 조건: 첫째, [[목적]]이 정당해야 한다(사적 이익이 아닌 공공의 이익). 둘째, 비폭력적이어야 한다. 셋째, 최후의 수단이어야 한다(합법적인 수단을 모두 사용한 후). 넷째, 공개적이어야 한다. 마지막으로 처벌을 감수해야 한다. 이와 달리 {소로}는 부정의한 법이 개선될 때까지 기다리면 부정의가 지속될 수 있으므로 양심에 따른 즉각적인 저항을 주장하였다.'],
      ['p','시민불복종은 인권을 신장하고 민주주의의 발전에 기여할 수 있다. 하지만 사회의 법과 제도를 어기는 행위이기에 시민들의 [[준법 의식]]을 약화하고 사회의 존립 자체를 위협할 수도 있다. 따라서 사회 정의를 실현하는 방향으로 심사숙고해서 이루어져야 한다.']
    ],
    justice: [
      ['h','1. 개인 윤리와 사회 윤리'],
      ['p','개인 윤리는 개인의 [[도덕성]]을 함양하여 사회의 윤리적 문제를 해결하려고 한다. 하지만 오늘날 빈부 격차, 세대 간·지역 간 갈등 등은 개인의 도덕성 함양만으로 해결하는 데 한계가 있다. 이를 보완하기 위해 등장한 사회 윤리는 사회의 구조와 [[제도]]를 개선하는 데 초점을 둔다.'],
      ['p','{니부어}는 도덕적인 개인일지라도 [[집단]]에 소속되면 이기심을 조절하는 힘이 떨어져 비도덕적인 행동을 하기 쉽다고 보았다. 또한 집단 사이의 갈등은 힘의 불균형으로 인해 발생하기 때문에 개인 윤리만으로는 해결하는 데 한계가 있다고 보았다. 따라서 사회 정의를 실현하기 위해서는 양심과 이타성을 강조하는 개인 윤리적 방법과 정치적 강제력을 동원하는 사회 윤리적 방법이 모두 필요하다고 주장하였다.'],
      ['h','2. 분배적 정의'],
      ['p','분배적 정의란 사회적 [[이익]]이나 부담을 공정하게 분배하여 구성원 각자가 정당한 몫을 누리도록 하는 것이다.'],
      ['p','[분배 기준의 장단점] 절대적 평등 - 장점: 모두에게 같은 혜택, 각자의 욕구를 균등하게 존중 / 단점: 개인 간의 정당한 차이 간과, 근로 의욕 및 효율성 저하. 능력 - 장점: 잠재력을 발휘할 기회 제공, 능력 함양 동기 부여 / 단점: 선천적·환경적 우연성 작용, 평가 기준 불확실. 노력 - 장점: 노력하는 자세 장려, 노력에 비례해 분배 / 단점: 노력의 정도와 결과가 불일치할 수 있음, 객관적 평가 어려움. 업적 - 장점: 객관적인 평가가 쉬움, 성취동기 및 생산성 향상 / 단점: 업적이 없는 사회적 약자 배려 힘듦, 서로 다른 분야의 업적은 평가가 어려움. 필요 - 장점: 사회적 약자의 인간다운 삶 보장, 사회 불평등 개선 / 단점: 모든 사람의 필요를 충족시킬 수 없음, 성취동기 약화.'],
      ['p','{롤스}는 정의의 본질을 공정성으로 해석하면서 절차의 공정성을 강조하였다. 그는 정의의 원칙을 합의하기 위한 공정한 절차로서 원초적 입장이라는 가상적 계약 상황을 설정하였다. 원초적 입장에서 각 개인은 자신의 재능, 출신, 성별, 사회적 상황 등을 알지 못하는 무지의 베일을 쓰고 있으며, 타인의 이익에는 무관심하고 자신의 이익을 합리적으로 추구한다. 계약 당사자들은 자신이 사회적 약자가 되는 위험한 상황을 회피하려고 하면서 정의의 원칙에 합의한다.'],
      ['p','제1원칙: 각 개인은 기본적 자유에 있어 평등한 권리를 가져야 한다(평등한 자유의 원칙). 제2원칙: 사회적·경제적 불평등은 ① 최소 수혜자에게 최대의 이익이 보장되고(차등의 원칙), ② 불평등의 계기가 되는 사회적 지위는 모든 사람에게 개방되어야 한다는([[기회균등]]의 원칙) 조건을 만족시킬 때 정당화될 수 있다. 두 원칙이 충돌하면 제1원칙이 우선한다. 무지의 베일은 선천적·환경적 우연성의 개입을 차단하기 위한 것으로, 개인이 지닌 재능의 분포 상황은 사회의 공동 자산으로 간주한다.'],
      ['p','{노직}은 정의란 개인의 [[소유권]]을 보장해 주는 것이라는 소유 권리론을 주장하였다. 재화의 취득과 양도의 절차가 정당하다면 그 소유물에 대해 개인이 절대적인 권리를 갖는다. 그러므로 국가는 개인의 소유를 절도·사기로부터 보호하고 국방을 담당하는 역할 정도만 해야 한다는 [[최소]] 국가론을 주장하였다. 정의의 원칙: 취득의 원칙, 양도의 원칙, 교정의 원칙(취득과 양도의 과정에서 부정의가 발생한다면 이를 교정해야 한다).'],
      ['h','3. 우대 정책과 역차별'],
      ['p','소수자란 집단 구성원의 수와 관계없이 차별받는 집단에 속해 있는 사람을 말하며, 소수자 우대 정책이란 차별로 인한 불이익을 보상해 주기 위해 소수자에게 혜택을 주는 정책이다. 사회통합 전형, 비례 대표 의원 여성 할당제, 장애인 의무 고용제 등이 해당한다. 찬성하는 사람들은 사회적 지위를 얻을 기회를 제공함으로써 실질적 평등을 이루어 나갈 수 있다고 주장한다.'],
      ['p','하지만 소수자 우대 정책으로 인해 다른 집단이 부당하게 불이익을 받는 [[역차별]]이 발생할 수 있다. 또한 과거의 차별로 이전 세대가 받은 고통에 대해 현세대가 보상받는다는 한계, 성과에 따라 분배하는 업적주의에 어긋난다는 비판도 있다.'],
      ['h','4. 교정적 정의'],
      ['p','교정적 정의란 범죄 행위에 대해 공정하게 [[처벌]]하고, 발생한 손해에 대해 합당하게 배상하도록 하여 부정의를 바로잡는 것이다.'],
      ['p','응보주의 관점에서는 처벌을 범죄 행위에 상응하는 [[보복]]을 가하는 것으로 본다. {칸트}는 이성적이고 자율적인 존재인 인간은 자신의 행위에 책임을 져야 하기 때문에 범죄 행위에 대한 대가로 응분의 처벌을 받는 것이 마땅하다고 주장하였다. 하지만 이 관점은 범죄 예방과 범죄자들의 [[교화]]를 소홀히 한다는 비판을 받는다.'],

  var SET_ORDER = ['civic', 'justice'];

  var state = {
    screen: 'setup', // setup | quiz | result
    setKey: 'civic',
    questions: [],
    answers: [],
    current: 0,
    showPassage: false
  };

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
    });
  }

  /* [[단어]] → 빨간 굵은 글씨, {이름} → 사상가 고정 색, \n → 줄바꿈 */
  function rich(s){
    return escapeHtml(s)
      .replace(/\[\[(.+?)\]\]/g, '<b class="key">$1</b>')
      .replace(/\{([^{}]+)\}/g, function(m, name){
        var v = THINKER_VAR[name];
        return v ? '<span class="who" style="color:var(--c-' + v + ')">' + name + '</span>' : m;
      })
      .replace(/\n/g, '<br>');
  }

  function passageHtml(){
    return PASSAGES[state.setKey].map(function(b){
      return b[0] === 'h' ? '<h4>' + escapeHtml(b[1]) + '</h4>' : '<p>' + rich(b[1]) + '</p>';
    }).join('');
  }

  function startQuiz(){
    state.questions = SETS[state.setKey].questions;
    state.answers = new Array(state.questions.length).fill(null);
    state.current = 0;
    state.showPassage = false;
    state.screen = 'quiz';
    render();
    window.scrollTo(0, 0);
  }

  function selectOption(i){
    if (state.answers[state.current] !== null) return;
    state.answers[state.current] = i;
    render();
  }
  function goPrev(){
    if (state.current > 0){ state.current--; render(); window.scrollTo(0, 0); }
  }
  function goNext(){
    if (state.current < state.questions.length - 1){
      state.current++;
      render();
    } else {
      state.screen = 'result';
      render();
    }
    window.scrollTo(0, 0);
  }
  function backToSetup(){
    state.questions = [];
    state.answers = [];
    state.current = 0;
    state.screen = 'setup';
    render();
    window.scrollTo(0, 0);
  }
  function retrySameQuiz(){
    startQuiz();
  }
  function togglePassage(){
    state.showPassage = !state.showPassage;
    render();
  }

  function renderSetupScreen(){
    var setRow = SET_ORDER.map(function(k){
      var s = SETS[k];
      return '<button type="button" class="diff-pill' + (state.setKey === k ? ' active' : '') + '" data-set="' + k + '">' +
        '<small>' + s.code + '</small>' + escapeHtml(s.name) + '</button>';
    }).join('');

    app.innerHTML =
      '<p class="eyebrow">' + escapeHtml(SUBTITLE) + ' · ' + escapeHtml(UNIT) + '</p>' +

      '<p class="lede">단원을 골라 풀어 봅시다. 파이팅!</p>' +
      '<div class="card">' +
        '<div class="field-block">' +
          '<label class="field-label">단원 (10문제 · 5지선다)</label>' +
          '<div class="diff-row" id="set-row">' + setRow + '</div>' +
          '<p class="set-desc" id="set-desc">' + escapeHtml(SETS[state.setKey].desc) + '</p>' +
        '</div>' +
        '<button type="button" class="btn btn-primary" id="generate-btn">퀴즈 시작하기</button>' +
      '</div>' +
      '<p class="signature">' + escapeHtml(SIGNATURE) + '</p>';

    var setRowEl = document.getElementById('set-row');
    setRowEl.addEventListener('click', function(ev){
      var btn = ev.target.closest('.diff-pill');
      if (!btn) return;
      state.setKey = btn.getAttribute('data-set');
      setRowEl.querySelectorAll('.diff-pill').forEach(function(p){
        p.classList.toggle('active', p === btn);
      });
      document.getElementById('set-desc').textContent = SETS[state.setKey].desc;
    });
    document.getElementById('generate-btn').addEventListener('click', function(){
      startQuiz();
    });
  }

  function renderPassageToggle(){
    return '<div class="quiz-passage-wrap">' +
      '<button type="button" class="passage-toggle-btn" id="passage-toggle-btn">' + (state.showPassage ? '교과서 접기' : '교과서 보기') + '</button>' +
      (state.showPassage ? '<div class="passage-box expanded" style="margin-top:10px;">' + passageHtml() + '</div>' : '') +
    '</div>';

  function setTag(){
    var s = SETS[state.setKey];
    return s.code + ' ' + s.name;
  }

  function renderQuizScreen(){
    var total = state.questions.length;
    var q = state.questions[state.current];
    var selected = state.answers[state.current];
    var answered = selected !== null;
    var isLast = state.current === total - 1;
    var pct = Math.round(((state.current) / total) * 100);
    var isCorrect = answered && selected === q.answer;

      } else if (selected === i){
        cls += ' selected';
      }
      return '<button type="button" class="' + cls + '" data-opt="' + i + '"' + (answered ? ' disabled' : '') + '>' +
        '<span class="option-mark">' + MARKS[i] + '</span>' +
        '<span>' + escapeHtml(opt) + '</span>' +
      '</button>';
    }).join('');

    var feedbackHtml = answered
      ? '<div class="feedback-box ' + (isCorrect ? 'correct' : 'wrong') + '">' +
          '<p class="feedback-label ' + (isCorrect ? 'correct' : 'wrong') + '">' + (isCorrect ? '정답입니다!' : '오답입니다') + '</p>' +
          '<p class="feedback-explain">' + rich(q.explain) + '</p>' +
        '</div>'
      : '';

    app.innerHTML =
      '<div class="card">' +
        '<div class="progress-row">' +
          '<span class="progress-label">질문 ' + (state.current + 1) + ' / ' + total + '</span>' +
          '<span class="diff-tag">' + escapeHtml(setTag()) + '</span>' +
        '</div>' +
        '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
        renderPassageToggle() +
        '<p class="question-text">' + escapeHtml(q.q) + '</p>' +
        (q.box ? '<div class="stim">' + q.box + '</div>' : '') +
        '<div class="options">' + optionsHtml + '</div>' +
        feedbackHtml +
        '<div class="nav-row">' +
          '<button type="button" class="btn btn-ghost" id="prev-btn"' + (state.current === 0 ? ' disabled' : '') + '>이전</button>' +
          '<button type="button" class="btn btn-primary" id="next-btn"' + (answered ? '' : ' disabled') + '>' + (isLast ? '결과 보기' : '다음 문제') + '</button>' +
        '</div>' +
      '</div>';

    if (!answered){
      app.querySelectorAll('.option').forEach(function(btn){
        btn.addEventListener('click', function(){
          selectOption(parseInt(btn.getAttribute('data-opt'), 10));
        });
      });
    }
    document.getElementById('passage-toggle-btn').addEventListener('click', togglePassage);
    document.getElementById('prev-btn').addEventListener('click', goPrev);
    document.getElementById('next-btn').addEventListener('click', goNext);
  }

  function renderResultScreen(){
    var total = state.questions.length;
    var score = 0;
    state.questions.forEach(function(q, i){
      if (state.answers[i] === q.answer) score++;
    });
    var tier = score >= Math.ceil(total * 0.8) ? 'tier-good' : (score <= Math.floor(total * 0.4) ? 'tier-bad' : 'tier-mid');
    var pctText = Math.round((score / total) * 100) + '점';

    var items = state.questions.map(function(q, i){
      var mine = state.answers[i];
      var correct = mine === q.answer;
      return '<div class="review-item ' + (correct ? 'correct' : 'wrong') + '">' +
        '<div class="review-head">' +
          '<span class="review-index">Q' + (i + 1) + '</span>' +
          '<span class="review-q">' + escapeHtml(q.q) + '</span>' +
        '</div>' +
        '<span class="review-chip ' + (correct ? 'correct' : 'wrong') + '">' + (correct ? '정답' : '오답') + '</span>' +
        (q.box ? '<details class="review-stim"><summary>제시문 다시 보기</summary><div class="stim">' + q.box + '</div></details>' : '') +
        '<div class="review-answers">' +
          '내 답: <b>' + CIRCLED[mine] + ' ' + escapeHtml(q.options[mine]) + '</b>' +
          (correct ? '' : '<br>정답: <b>' + CIRCLED[q.answer] + ' ' + escapeHtml(q.options[q.answer]) + '</b>') +
        '</div>' +
        '<p class="review-explain"><b>해설</b> ' + rich(q.explain) + '</p>' +
      '</div>';
    }).join('');

    var encourageText = score === total ? '참 잘했어요!'
      : tier === 'tier-good' ? '잘했어요! 틀린 문제만 다시 확인해볼까요?'
      : tier === 'tier-mid' ? '좋아요! 틀린 문제를 다시 살펴봐요.'
      : '한 번 더 도전해봐요!';
    var perfectHtml = '<p class="perfect-badge' + (score === total ? '' : ' encourage') + '">' + encourageText + '</p>';

    app.innerHTML =
      '<p class="eyebrow">채점 결과 · ' + escapeHtml(setTag()) + '</p>' +
      '<h1 class="title">「' + escapeHtml(TITLE) + '」 퀴즈 결과</h1>' +
      '<div class="card">' +
        '<div class="score-tile">' +
          '<p class="score-number ' + tier + '">' + score + '/' + total + '</p>' +
          '<p class="score-caption">' + total + '문제 중 ' + score + '개 정답 · ' + pctText + '</p>' +
          perfectHtml +
        '</div>' +
      '</div>' +
      '<div class="card" style="margin-top:16px;">' + renderPassageToggle() + items + '</div>' +
      '<div class="btn-row">' +
        '<button type="button" class="btn btn-primary" id="retry-btn">다시 풀기</button>' +
        '<button type="button" class="btn btn-ghost" id="reset-btn">단원 다시 선택</button>' +
      '</div>' +
      '<p class="signature">' + escapeHtml(SIGNATURE) + '</p>';

    var toggleBtn = document.getElementById('passage-toggle-btn');
    if (toggleBtn) toggleBtn.addEventListener('click', togglePassage);
    document.getElementById('retry-btn').addEventListener('click', retrySameQuiz);
    document.getElementById('reset-btn').addEventListener('click', backToSetup);
  }

  function suppressHoverUntilMove(){
    document.body.classList.add('suppress-hover');
    document.addEventListener('mousemove', function onMove(){
      document.body.classList.remove('suppress-hover');
      document.removeEventListener('mousemove', onMove);
    }, { once: true });
  }

  function render(){
    suppressHoverUntilMove();
    if (state.screen === 'setup') renderSetupScreen();
    else if (state.screen === 'quiz') renderQuizScreen();
    else if (state.screen === 'result') renderResultScreen();
  }

  render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>나의 학습 유형 찾기</title>
<style>
  :root{
    --bg1:#fdf2f8;
    --bg2:#eef2ff;
    --card:#ffffff;
    --ink:#3b3550;
    --sub:#8b849c;
    --pink:#ffb3c6;
    --pink-deep:#ff8fab;
    --purple:#c8b6ff;
    --blue:#a0d2ff;
    --yellow:#ffe08a;
    --green:#b8f2d6;
    --shadow:0 10px 30px rgba(150,120,180,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
  }
  .app{
    width:100%;
    max-width:420px;
  }
  .card{
    background:var(--card);
    border-radius:28px;
    padding:32px 24px;
    box-shadow:var(--shadow);
    min-height:480px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:-60px; right:-60px;
    width:160px; height:160px;
    background:var(--pink);
    opacity:0.25;
    border-radius:50%;
  }
  .card::after{
    content:"";
    position:absolute;
    bottom:-70px; left:-50px;
    width:180px; height:180px;
    background:var(--blue);
    opacity:0.25;
    border-radius:50%;
  }
  .screen{ position:relative; z-index:1; display:none; }
  .screen.active{ display:block; animation:fadeUp .35s ease; }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(12px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .emoji-big{ font-size:56px; text-align:center; margin-bottom:8px; }
  h1{
    font-size:22px;
    text-align:center;
    margin:0 0 8px;
    line-height:1.4;
  }
  .desc{
    text-align:center;
    color:var(--sub);
    font-size:14px;
    line-height:1.6;
    margin-bottom:28px;
  }
  label.name-label{
    display:block;
    font-size:14px;
    font-weight:600;
    margin-bottom:8px;
    color:var(--ink);
  }
  input[type="text"]{
    width:100%;
    padding:14px 16px;
    border-radius:16px;
    border:2px solid #eee1f5;
    font-size:16px;
    outline:none;
    background:#faf7ff;
    color:var(--ink);
    margin-bottom:20px;
  }
  input[type="text"]:focus{
    border-color:var(--purple);
  }
  button.primary{
    width:100%;
    padding:16px;
    border:none;
    border-radius:18px;
    background:linear-gradient(135deg,var(--pink-deep),var(--purple));
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(255,143,171,0.35);
  }
  button.primary:active{ transform:scale(0.98); }

  .progress-wrap{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
  }
  .progress-bar{
    flex:1;
    height:8px;
    background:#f0e9fb;
    border-radius:999px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--pink-deep),var(--purple));
    border-radius:999px;
    transition:width .3s ease;
  }
  .progress-text{
    font-size:12px;
    color:var(--sub);
    white-space:nowrap;
    font-weight:600;
  }
  .q-text{
    font-size:19px;
    font-weight:700;
    line-height:1.5;
    margin-bottom:22px;
    min-height:78px;
  }
  .option{
    display:block;
    width:100%;
    text-align:left;
    padding:16px 18px;
    margin-bottom:12px;
    border-radius:18px;
    border:2px solid #f1eaf9;
    background:#fbfaff;
    color:var(--ink);
    font-size:15px;
    line-height:1.5;
    cursor:pointer;
    transition:all .15s ease;
  }
  .option:hover{
    border-color:var(--purple);
    background:#f6f0ff;
  }
  .option:active{ transform:scale(0.98); }

  .result-badge{
    display:inline-block;
    margin:0 auto 14px;
    padding:6px 16px;
    background:var(--yellow);
    color:#7a5b00;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
  }
  .badge-wrap{ text-align:center; }
  .result-type{
    text-align:center;
    font-size:24px;
    font-weight:800;
    margin-bottom:6px;
  }
  .result-name{
    text-align:center;
    font-size:14px;
    color:var(--sub);
    margin-bottom:18px;
  }
  .result-desc{
    background:#f7f4ff;
    border-radius:18px;
    padding:16px 18px;
    font-size:14px;
    line-height:1.7;
    margin-bottom:18px;
  }
  .tip-title{
    font-size:14px;
    font-weight:700;
    margin-bottom:10px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .tip-list{
    list-style:none;
    margin:0 0 24px;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .tip-list li{
    background:var(--green);
    background:linear-gradient(135deg,#fff,#f5fff9);
    border:1px solid #d9f3e4;
    border-radius:16px;
    padding:12px 14px;
    font-size:13.5px;
    line-height:1.55;
  }
  button.ghost{
    width:100%;
    padding:14px;
    border-radius:18px;
    border:2px solid #ecd9ff;
    background:#fff;
    color:#8452c9;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  .footer-note{
    text-align:center;
    font-size:11px;
    color:#b7aec9;
    margin-top:16px;
  }
</style>
</head>
<body>

<div class="app">
  <div class="card">

    <!-- 시작 화면 -->
    <section class="screen active" id="screen-start">
      <div class="emoji-big">🧭</div>
      <h1>나의 학습 유형 찾기</h1>
      <p class="desc">8개의 질문에 솔직하게 답하면<br>나에게 딱 맞는 공부 스타일을 알려드려요!</p>
      <label class="name-label" for="nameInput">이름(닉네임)을 입력해주세요</label>
      <input type="text" id="nameInput" placeholder="예: 김민수" maxlength="12">
      <button class="primary" id="startBtn">진단 시작하기</button>
    </section>

    <!-- 질문 화면 -->
    <section class="screen" id="screen-quiz">
      <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-text" id="progressText">1 / 8</div>
      </div>
      <div class="q-text" id="qText"></div>
      <div id="optionsWrap"></div>
    </section>

    <!-- 결과 화면 -->
    <section class="screen" id="screen-result">
      <div class="badge-wrap"><span class="result-badge" id="resultBadge">진단 결과</span></div>
      <div class="result-type" id="resultType"></div>
      <div class="result-name" id="resultName"></div>
      <div class="result-desc" id="resultDesc"></div>
      <div class="tip-title">📌 이런 방법으로 공부해보세요</div>
      <ul class="tip-list" id="tipList"></ul>
      <button class="ghost" id="restartBtn">다시 진단하기</button>
    </section>

  </div>
  <div class="footer-note">본 진단은 재미를 위한 자가진단으로, 입력 정보는 저장·전송되지 않습니다.</div>
</div>

<script>
(function(){
  var questions = [
    {
      text: "① 새로운 내용을 배울 때 나는?",
      opts: [
        {t:"그림·도표가 있으면 이해가 빠르다", type:"V"},
        {t:"설명을 들으면 잘 외워진다", type:"A"},
        {t:"직접 해봐야 안다", type:"K"}
      ]
    },
    {
      text: "② 시험 공부할 때 나는?",
      opts: [
        {t:"색깔펜으로 정리하고 마인드맵을 그린다", type:"V"},
        {t:"소리 내어 읽거나 누군가에게 설명한다", type:"A"},
        {t:"문제를 계속 풀어보며 익힌다", type:"K"}
      ]
    },
    {
      text: "③ 수업 시간에 집중이 잘 되는 때는?",
      opts: [
        {t:"칠판이나 PPT 화면을 볼 때", type:"V"},
        {t:"선생님 목소리에 집중해서 들을 때", type:"A"},
        {t:"실습이나 활동을 할 때", type:"K"}
      ]
    },
    {
      text: "④ 처음 가는 길을 찾을 때 나는?",
      opts: [
        {t:"지도를 보면서 찾는다", type:"V"},
        {t:"사람들에게 물어보며 찾는다", type:"A"},
        {t:"일단 걸어가면서 감으로 찾는다", type:"K"}
      ]
    },
    {
      text: "⑤ 예전 일을 기억할 때 나는?",
      opts: [
        {t:"그때의 장면·이미지가 먼저 떠오른다", type:"V"},
        {t:"그때 들었던 말이나 소리가 먼저 떠오른다", type:"A"},
        {t:"그때 몸으로 느꼈던 행동이 먼저 떠오른다", type:"K"}
      ]
    },
    {
      text: "⑥ 친구가 새로운 게임 규칙을 설명해줄 때 나는?",
      opts: [
        {t:"그림이나 설명서를 보여달라고 한다", type:"V"},
        {t:"말로 자세히 설명해달라고 한다", type:"A"},
        {t:"일단 같이 해보면서 배운다", type:"K"}
      ]
    },
    {
      text: "⑦ 발표 준비를 할 때 나는?",
      opts: [
        {t:"슬라이드나 그림 자료를 꼼꼼히 만든다", type:"V"},
        {t:"말할 내용을 소리 내어 연습한다", type:"A"},
        {t:"실제처럼 움직이며 리허설해본다", type:"K"}
      ]
    },
    {
      text: "⑧ 쉬는 시간에 스트레스를 풀 때 나는?",
      opts: [
        {t:"영상이나 웹툰을 본다", type:"V"},
        {t:"음악을 듣거나 친구와 수다를 떤다", type:"A"},
        {t:"몸을 움직이거나 돌아다닌다", type:"K"}
      ]
    }
  ];

  var results = {
    V: {
      emoji:"👀",
      title:"시각형",
      desc:"눈으로 보는 정보에 특히 강한 <b>시각형</b> 학습자예요. 그림, 도표, 색깔, 이미지로 정리할 때 이해와 기억의 속도가 확 빨라져요.",
      tips:[
        "필기할 때 색깔펜·형광펜으로 구분해서 정리해보세요.",
        "마인드맵, 표, 그래프로 개념을 시각적으로 정리해보세요.",
        "공부할 내용과 관련된 이미지나 영상 자료를 함께 찾아보세요."
      ]
    },
    A: {
      emoji:"🎧",
      title:"청각형",
      desc:"듣고 말하는 과정에서 학습 효과가 극대화되는 <b>청각형</b>이에요. 설명을 듣거나 소리 내어 말할 때 기억에 오래 남아요.",
      tips:[
        "배운 내용을 소리 내어 읽거나 친구에게 설명해보세요.",
        "중요한 강의는 녹음해서 다시 들어보세요.",
        "스터디그룹에서 서로 묻고 답하며 토론식으로 공부해보세요."
      ]
    },
    K: {
      emoji:"🙌",
      title:"체험형",
      desc:"직접 해보고 몸으로 부딪히며 배우는 <b>체험형</b>이에요. 가만히 앉아 듣기보다 실습과 문제풀이로 익힐 때 효과가 커요.",
      tips:[
        "이론 설명보다 문제풀이·실습 위주로 공부 시간을 배분해보세요.",
        "손으로 직접 써보거나 몸을 움직이며 암기해보세요.",
        "실험·실습·현장학습 기회가 있다면 적극적으로 참여해보세요."
      ]
    },
    VA: {
      emoji:"👀🎧",
      title:"시각+청각 복합형",
      desc:"보는 것과 듣는 것 모두에 강한 균형 잡힌 학습자예요. 자료를 눈으로 보면서 동시에 설명을 들을 때 학습 효율이 최고예요.",
      tips:[
        "그림 자료와 설명이 함께 있는 강의 영상을 활용해보세요.",
        "필기하면서 동시에 소리 내어 따라 읽어보세요.",
        "색깔로 정리한 노트를 보며 친구에게 설명해보세요."
      ]
    },
    VK: {
      emoji:"👀🙌",
      title:"시각+체험 복합형",
      desc:"보고 이해한 뒤 직접 해봐야 완전히 내 것이 되는 유형이에요. 그림·도표로 개념을 먼저 파악하고 문제풀이로 확인할 때 효과적이에요.",
      tips:[
        "개념은 도표·그림으로, 적용은 문제풀이로 나눠서 공부해보세요.",
        "손으로 직접 그림을 그려가며 개념을 정리해보세요.",
        "실습 전에 관련 이미지나 영상으로 미리 예습해보세요."
      ]
    },
    AK: {
      emoji:"🎧🙌",
      title:"청각+체험 복합형",
      desc:"듣고 바로 움직여야 이해가 되는 활동적인 유형이에요. 설명을 들으며 직접 따라 해볼 때 학습 효과가 가장 좋아요.",
      tips:[
        "강의를 들으면서 바로바로 문제를 풀어보세요.",
        "배운 내용을 몸짓이나 행동으로 표현하며 암기해보세요.",
        "친구와 서로 설명해주고 바로 확인 문제를 풀어보세요."
      ]
    }
  };

  var current = 0;
  var scores = {V:0, A:0, K:0};
  var userName = "";

  var screenStart = document.getElementById("screen-start");
  var screenQuiz = document.getElementById("screen-quiz");
  var screenResult = document.getElementById("screen-result");
  var nameInput = document.getElementById("nameInput");
  var startBtn = document.getElementById("startBtn");
  var restartBtn = document.getElementById("restartBtn");

  function showScreen(el){
    [screenStart, screenQuiz, screenResult].forEach(function(s){ s.classList.remove("active"); });
    el.classList.add("active");
  }

  startBtn.addEventListener("click", function(){
    userName = nameInput.value.trim();
    if(!userName){ userName = "친구"; }
    current = 0;
    scores = {V:0, A:0, K:0};
    showScreen(screenQuiz);
    renderQuestion();
  });

  function renderQuestion(){
    var q = questions[current];
    document.getElementById("progressText").textContent = (current+1) + " / " + questions.length;
    document.getElementById("progressFill").style.width = ((current)/questions.length*100) + "%";
    document.getElementById("qText").textContent = q.text;

    var wrap = document.getElementById("optionsWrap");
    wrap.innerHTML = "";
    q.opts.forEach(function(opt, idx){
      var btn = document.createElement("button");
      btn.className = "option";
      btn.textContent = (idx===0?"① ":idx===1?"② ":"③ ") + opt.t;
      btn.addEventListener("click", function(){ selectAnswer(opt.type); });
      wrap.appendChild(btn);
    });
  }

  function selectAnswer(type){
    scores[type]++;
    current++;
    if(current < questions.length){
      renderQuestion();
    } else {
      document.getElementById("progressFill").style.width = "100%";
      showResult();
    }
  }

  function computeResultKey(){
    var max = Math.max(scores.V, scores.A, scores.K);
    var top = Object.keys(scores).filter(function(k){ return scores[k] === max; });
    if(top.length === 1){ return top[0]; }
    var order = ["V","A","K"];
    top.sort(function(a,b){ return order.indexOf(a) - order.indexOf(b); });
    return top.join("");
  }

  function showResult(){
    var key = computeResultKey();
    var r = results[key] || results.V;

    document.getElementById("resultBadge").textContent = userName + "님의 학습 유형";
    document.getElementById("resultType").textContent = r.emoji + " " + r.title;
    document.getElementById("resultName").textContent =
      "시각 " + scores.V + " · 청각 " + scores.A + " · 체험 " + scores.K;
    document.getElementById("resultDesc").innerHTML = r.desc;

    var tipList = document.getElementById("tipList");
    tipList.innerHTML = "";
    r.tips.forEach(function(tip){
      var li = document.createElement("li");
      li.textContent = tip;
      tipList.appendChild(li);
    });

    showScreen(screenResult);
  }

  restartBtn.addEventListener("click", function(){
    nameInput.value = "";
    showScreen(screenStart);
  });

})();
</script>

</body>
</html>
